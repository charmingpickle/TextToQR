<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#09090b" />
  <title>Tap → QR</title>

  <!-- External Dependencies -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    :root {
      --bg-main: #09090b;
      --bg-surface: #18181b;
      --bg-card: #27272a;
      --accent-color: #3b82f6;
      --accent-hover: #2563eb;
      --text-main: #f4f4f5;
      --text-muted: #a1a1aa;
      --border-color: #3f3f46;
      --box-highlight: rgba(59, 130, 246, 0.35);
      --box-border: #60a5fa;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg-main);
      color: var(--text-main);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .view {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
    }

    /* --- Viewport & Camera Layout --- */
    .viewport {
      flex: 1;
      position: relative;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    video, #captured-image {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* Framing Guide Overlay */
    .view-finder {
      position: absolute;
      width: 75%;
      height: 45%;
      border: 2px dashed rgba(255, 255, 255, 0.4);
      border-radius: 16px;
      pointer-events: none;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .view-finder::after {
      content: "Align text within frame";
      color: rgba(255, 255, 255, 0.6);
      font-size: 0.85rem;
      font-weight: 500;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      background: rgba(0, 0, 0, 0.6);
      padding: 6px 12px;
      border-radius: 20px;
      backdrop-filter: blur(4px);
    }

    /* Target Interactive Box Overlays */
    #overlay-container {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: auto;
    }

    .box-target {
      position: absolute;
      border: 2px solid var(--box-border);
      background: var(--box-highlight);
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      transition: transform 0.1s ease, background-color 0.15s ease;
    }

    .box-target:active {
      transform: scale(0.96);
      background: rgba(59, 130, 246, 0.6);
      border-color: #ffffff;
    }

    /* Loading Spinner Overlay */
    .loader-overlay {
      position: absolute;
      inset: 0;
      background: rgba(9, 9, 11, 0.85);
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      gap: 16px;
    }

    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid var(--border-color);
      border-top-color: var(--accent-color);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Controls Header & Footer */
    .control-bar {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 24px 32px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
      z-index: 10;
    }

    .shutter-btn {
      width: 80px; height: 80px;
      border-radius: 50%;
      border: 4px solid #fff;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      outline: none;
      transition: transform 0.1s ease;
    }

    .shutter-btn:active {
      transform: scale(0.92);
    }

    .shutter-btn-inner {
      width: 62px; height: 62px;
      border-radius: 50%;
      background: #fff;
    }

    .icon-btn {
      width: 48px; height: 48px;
      border-radius: 50%;
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.2);
      color: white;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .icon-btn:active {
      background: rgba(255,255,255,0.3);
    }

    /* Selection & QR Display Styles */
    .view-header {
      padding: 18px 20px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-color);
      text-align: center;
      font-weight: 600;
      font-size: 1.05rem;
    }

    .action-bar {
      padding: 16px 20px 28px;
      background: var(--bg-surface);
      border-top: 1px solid var(--border-color);
      display: flex;
      gap: 12px;
    }

    button.btn {
      flex: 1;
      background: var(--accent-color);
      color: white;
      border: none;
      padding: 14px 20px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background-color 0.15s ease;
    }

    button.btn:active {
      background: var(--accent-hover);
    }

    button.btn-secondary {
      background: var(--bg-card);
      color: var(--text-main);
      border: 1px solid var(--border-color);
    }

    button.btn-secondary:active {
      background: var(--border-color);
    }

    /* Output QR Section */
    #qr-container-view {
      flex: 1;
      overflow-y: auto;
      padding: 32px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
    }

    .qr-card {
      background: #ffffff;
      padding: 20px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .text-editor-card {
      width: 100%;
      max-width: 360px;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .text-editor-card label {
      font-size: 0.75rem;
      text-transform: uppercase;
      color: var(--text-muted);
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    #result-text {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 1.15rem;
      color: var(--text-main);
      outline: none;
      word-break: break-all;
      min-height: 1.5em;
      user-select: text;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- CAMERA VIEW -->
  <div id="camera-view" class="view">
    <div class="viewport">
      <video id="video" autoplay playsinline muted></video>
      <div class="view-finder"></div>
    </div>
    <div class="control-bar">
      <button class="icon-btn" id="btn-switch" aria-label="Switch Camera">⟳</button>
      <button class="shutter-btn" id="btn-capture" aria-label="Take Photo">
        <div class="shutter-btn-inner"></div>
      </button>
      <div style="width: 48px;"></div>
    </div>
  </div>

  <!-- SELECT VIEW -->
  <div id="select-view" class="view hidden">
    <div class="view-header">Tap detected text to convert</div>
    <div class="viewport" id="select-viewport">
      <img id="captured-image" alt="Captured document" />
      <div id="overlay-container"></div>
      <div id="ocr-loader" class="loader-overlay">
        <div class="spinner"></div>
        <div style="font-weight: 500;">Enhancing & Reading Text…</div>
      </div>
    </div>
    <div class="action-bar">
      <button id="btn-retake" class="btn btn-secondary">Retake Photo</button>
    </div>
  </div>

  <!-- QR OUTPUT VIEW -->
  <div id="qr-view" class="view hidden">
    <div class="view-header">Generated QR Code</div>
    <div id="qr-container-view">
      <div class="qr-card">
        <div id="qrcode"></div>
      </div>
      <div class="text-editor-card">
        <label>Extracted Text (Tap to edit)</label>
        <div id="result-text" contenteditable="true" spellcheck="false"></div>
      </div>
    </div>
    <div class="action-bar">
      <button id="btn-pick-another" class="btn btn-secondary">Select Another</button>
      <button id="btn-new-photo" class="btn">New Photo</button>
    </div>
  </div>

  <script>
    // State & DOM Selectors
    const video = document.getElementById('video');
    const cameraView = document.getElementById('camera-view');
    const selectView = document.getElementById('select-view');
    const qrView = document.getElementById('qr-view');
    const capturedImage = document.getElementById('captured-image');
    const overlayContainer = document.getElementById('overlay-container');
    const ocrLoader = document.getElementById('ocr-loader');
    const resultText = document.getElementById('result-text');
    const qrcodeEl = document.getElementById('qrcode');

    let stream = null;
    let devices = [];
    let currentDeviceIdx = 0;
    let tesseractWorker = null;
    let qrcodeInstance = null;

    // Initialization
    async function initApp() {
      try {
        devices = (await navigator.mediaDevices.enumerateDevices())
          .filter(d => d.kind === 'videoinput');
        
        await startCamera({ facingMode: { ideal: 'environment' } });
      } catch (e) {
        alert('Camera access is required to use this application.');
      }
    }

    async function startCamera(constraints) {
      if (stream) stream.getTracks().forEach(t => t.stop());
      
      const defaultConstraints = {
        video: {
          width: { ideal: 3840 },
          height: { ideal: 2160 },
          ...constraints
        },
        audio: false
      };

      stream = await navigator.mediaDevices.getUserMedia(defaultConstraints);
      video.srcObject = stream;

      // Enable continuous autofocus if supported by hardware
      const track = stream.getVideoTracks()[0];
      try {
        const caps = track.getCapabilities?.();
        if (caps?.focusMode?.includes('continuous')) {
          await track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] });
        }
      } catch (e) {}
    }

    // Camera Switcher
    document.getElementById('btn-switch').onclick = () => {
      if (devices.length < 2) return;
      currentDeviceIdx = (currentDeviceIdx + 1) % devices.length;
      startCamera({ deviceId: { exact: devices[currentDeviceIdx].deviceId } });
    };

    // Advanced Image Enhancement Pipeline (Sauvola Binarization & DPI Scaling)
    function preprocessCanvas(sourceCanvas) {
      const maxDimension = 2000;
      let width = sourceCanvas.width;
      let height = sourceCanvas.height;

      if (width > maxDimension || height > maxDimension) {
        if (width > height) {
          height = Math.round((height * maxDimension) / width);
          width = maxDimension;
        } else {
          width = Math.round((width * maxDimension) / height);
          height = maxDimension;
        }
      }

      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(sourceCanvas, 0, 0, width, height);

      const imgData = ctx.getImageData(0, 0, width, height);
      const data = imgData.data;
      const gray = new Float32Array(width * height);

      // 1. Grayscale conversion
      for (let i = 0, j = 0; i < data.length; i += 4, j++) {
        gray[j] = data[i] * 0.299 + data[i + 1] * 0.587 + data[i + 2] * 0.114;
      }

      // 2. Local Sauvola Adaptive Binarization
      const windowSize = 15;
      const halfW = Math.floor(windowSize / 2);
      const k = 0.2;
      const R = 128;
      const binary = new Uint8ClampedArray(width * height);

      // Integral images for quick local mean & variance computation
      const integral = new Float64Array((width + 1) * (height + 1));
      const integralSq = new Float64Array((width + 1) * (height + 1));

      for (let y = 0; y < height; y++) {
        let rowSum = 0;
        let rowSumSq = 0;
        for (let x = 0; x < width; x++) {
          const idx = y * width + x;
          const val = gray[idx];
          rowSum += val;
          rowSumSq += val * val;

          const iIdx = (y + 1) * (width + 1) + (x + 1);
          integral[iIdx] = integral[iIdx - (width + 1)] + rowSum;
          integralSq[iIdx] = integralSq[iIdx - (width + 1)] + rowSumSq;
        }
      }

      function getAreaSum(arr, x1, y1, x2, y2) {
        const w = width + 1;
        return arr[y2 * w + x2] - arr[y1 * w + x2] - arr[y2 * w + x1] + arr[y1 * w + x1];
      }

      for (let y = 0; y < height; y++) {
        const y1 = Math.max(0, y - halfW);
        const y2 = Math.min(height, y + halfW + 1);

        for (let x = 0; x < width; x++) {
          const x1 = Math.max(0, x - halfW);
          const x2 = Math.min(width, x + halfW + 1);

          const count = (x2 - x1) * (y2 - y1);
          const sum = getAreaSum(integral, x1, y1, x2, y2);
          const sumSq = getAreaSum(integralSq, x1, y1, x2, y2);

          const mean = sum / count;
          const variance = (sumSq / count) - (mean * mean);
          const stdDev = Math.sqrt(Math.max(0, variance));

          const threshold = mean * (1 + k * ((stdDev / R) - 1));
          const idx = y * width + x;
          binary[idx] = gray[idx] < threshold ? 0 : 255;
        }
      }

      // 3. Write processed data back to canvas
      for (let i = 0, j = 0; i < data.length; i += 4, j++) {
        const val = binary[j];
        data[i] = val;
        data[i + 1] = val;
        data[i + 2] = val;
      }
      ctx.putImageData(imgData, 0, 0);
      return canvas;
    }

    // Capture Photo Trigger
    document.getElementById('btn-capture').onclick = () => {
      if (!video.videoWidth) return;

      const rawCanvas = document.createElement('canvas');
      rawCanvas.width = video.videoWidth;
      rawCanvas.height = video.videoHeight;
      rawCanvas.getContext('2d').drawImage(video, 0, 0);

      capturedImage.src = rawCanvas.toDataURL('image/jpeg', 0.95);

      cameraView.classList.add('hidden');
      selectView.classList.remove('hidden');
      ocrLoader.classList.remove('hidden');
      overlayContainer.innerHTML = '';

      capturedImage.onload = () => runOCR(rawCanvas);
    };

    // High Accuracy OCR Runner
    async function runOCR(rawCanvas) {
      try {
        const processedCanvas = preprocessCanvas(rawCanvas);

        if (!tesseractWorker) {
          tesseractWorker = await Tesseract.createWorker('eng');
        }

        await tesseractWorker.setParameters({
          tessedit_pageseg_mode: Tesseract.PSM.SPARSE_TEXT,
          preserve_interword_spaces: '1'
        });

        const { data } = await tesseractWorker.recognize(processedCanvas);
        renderBoundingBoxes(data.words || [], processedCanvas.width, processedCanvas.height);
      } catch (err) {
        alert('Failed to read text from image. Please try again.');
        console.error(err);
      } finally {
        ocrLoader.classList.add('hidden');
      }
    }

    // Render Clickable Targets Over Image
    function renderBoundingBoxes(words, imgWidth, imgHeight) {
      overlayContainer.innerHTML = '';
      
      const rect = capturedImage.getBoundingClientRect();
      const scaleX = rect.width / imgWidth;
      const scaleY = rect.height / imgHeight;

      words.forEach(word => {
        const cleanText = word.text.trim();
        if (cleanText.length < 2) return;

        const box = document.createElement('div');
        box.className = 'box-target';
        box.style.left = `${word.bbox.x0 * scaleX}px`;
        box.style.top = `${word.bbox.y0 * scaleY}px`;
        box.style.width = `${(word.bbox.x1 - word.bbox.x0) * scaleX}px`;
        box.style.height = `${(word.bbox.y1 - word.bbox.y0) * scaleY}px`;

        box.onclick = () => selectText(cleanText);
        overlayContainer.appendChild(box);
      });
    }

    // Handle Selection & QR Generation
    function selectText(text) {
      selectView.classList.add('hidden');
      qrView.classList.remove('hidden');
      resultText.textContent = text;
      renderQRCode(text);
    }

    function renderQRCode(text) {
      qrcodeEl.innerHTML = '';
      qrcodeInstance = new QRCode(qrcodeEl, {
        text: text || ' ',
        width: 220,
        height: 220,
        colorDark: "#000000",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.H
      });
    }

    // Live QR Update on Text Edit
    resultText.oninput = () => {
      renderQRCode(resultText.textContent);
    };

    // Navigation Buttons
    document.getElementById('btn-retake').onclick = resetToCamera;
    document.getElementById('btn-new-photo').onclick = resetToCamera;
    
    document.getElementById('btn-pick-another').onclick = () => {
      qrView.classList.add('hidden');
      selectView.classList.remove('hidden');
    };

    function resetToCamera() {
      selectView.classList.add('hidden');
      qrView.classList.add('hidden');
      cameraView.classList.remove('hidden');
      overlayContainer.innerHTML = '';
    }

    // Start App on Load
    window.onload = initApp;
  </script>
</body>
</html>

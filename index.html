<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#09090b" />
  <title>Tap → QR Pro</title>

  <!-- External Dependencies -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    :root {
      --bg-main: #09090b;
      --bg-surface: #18181b;
      --bg-card: #27272a;
      --accent-color: #3b82f6;
      --accent-hover: #2563eb;
      --text-main: #f4f4f5;
      --text-muted: #a1a1aa;
      --border-color: #3f3f46;
      --box-highlight: rgba(59, 130, 246, 0.4);
      --box-border: #60a5fa;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-main);
      color: var(--text-main);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .view {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
    }

    .viewport {
      flex: 1;
      position: relative;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      cursor: crosshair;
    }

    video, #captured-image {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* Top Controls Bar */
    .top-bar {
      position: absolute;
      top: 16px;
      left: 16px;
      right: 16px;
      z-index: 15;
      display: flex;
      justify-content: center;
    }

    .camera-select {
      background: rgba(24, 24, 27, 0.85);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      backdrop-filter: blur(10px);
      outline: none;
      max-width: 90%;
      text-overflow: ellipsis;
    }

    /* Framing Reticle */
    .view-finder {
      position: absolute;
      width: 80%;
      height: 45%;
      border: 2px dashed rgba(255, 255, 255, 0.4);
      border-radius: 16px;
      pointer-events: none;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.55);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .view-finder::after {
      content: "Tap video to focus";
      color: rgba(255, 255, 255, 0.85);
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      background: rgba(0, 0, 0, 0.65);
      padding: 6px 14px;
      border-radius: 20px;
      backdrop-filter: blur(4px);
    }

    /* OCR Target Selection Boxes */
    #overlay-container {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: auto;
    }

    .box-target {
      position: absolute;
      border: 2px solid var(--box-border);
      background: var(--box-highlight);
      border-radius: 4px;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
      transition: transform 0.1s ease;
    }

    .box-target:active {
      transform: scale(0.95);
      background: rgba(59, 130, 246, 0.7);
      border-color: #ffffff;
    }

    /* Loader */
    .loader-overlay {
      position: absolute;
      inset: 0;
      background: rgba(9, 9, 11, 0.85);
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      gap: 16px;
    }

    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid var(--border-color);
      border-top-color: var(--accent-color);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Shutter Bar */
    .control-bar {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 24px 32px 40px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
      z-index: 10;
    }

    .shutter-btn {
      width: 80px; height: 80px;
      border-radius: 50%;
      border: 4px solid #fff;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      outline: none;
      transition: transform 0.1s ease;
    }

    .shutter-btn:active {
      transform: scale(0.92);
    }

    .shutter-btn-inner {
      width: 62px; height: 62px;
      border-radius: 50%;
      background: #fff;
    }

    /* Action Headers & Footers */
    .view-header {
      padding: 18px 20px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-color);
      text-align: center;
      font-weight: 600;
      font-size: 1.05rem;
    }

    .action-bar {
      padding: 16px 20px 28px;
      background: var(--bg-surface);
      border-top: 1px solid var(--border-color);
      display: flex;
      gap: 12px;
    }

    button.btn {
      flex: 1;
      background: var(--accent-color);
      color: white;
      border: none;
      padding: 14px 20px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.15s ease;
    }

    button.btn:active {
      background: var(--accent-hover);
    }

    button.btn-secondary {
      background: var(--bg-card);
      color: var(--text-main);
      border: 1px solid var(--border-color);
    }

    /* Output View */
    #qr-container-view {
      flex: 1;
      overflow-y: auto;
      padding: 32px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
    }

    .qr-card {
      background: #ffffff;
      padding: 20px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .text-editor-card {
      width: 100%;
      max-width: 360px;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .text-editor-card label {
      font-size: 0.75rem;
      text-transform: uppercase;
      color: var(--text-muted);
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    #result-text {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 1.15rem;
      color: var(--text-main);
      outline: none;
      word-break: break-all;
      min-height: 1.5em;
      user-select: text;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- CAMERA VIEW -->
  <div id="camera-view" class="view">
    <div class="top-bar">
      <select id="camera-select" class="camera-select">
        <option value="">Detecting cameras...</option>
      </select>
    </div>
    <div class="viewport" id="camera-viewport">
      <video id="video" autoplay playsinline muted></video>
      <div class="view-finder"></div>
    </div>
    <div class="control-bar">
      <button class="shutter-btn" id="btn-capture" aria-label="Take Photo">
        <div class="shutter-btn-inner"></div>
      </button>
    </div>
  </div>

  <!-- OCR SELECTION VIEW -->
  <div id="select-view" class="view hidden">
    <div class="view-header">Tap text box to convert to QR</div>
    <div class="viewport">
      <img id="captured-image" alt="Captured screen" />
      <div id="overlay-container"></div>
      <div id="ocr-loader" class="loader-overlay">
        <div class="spinner"></div>
        <div style="font-weight: 500;" id="loader-status">Processing Screen Text...</div>
      </div>
    </div>
    <div class="action-bar">
      <button id="btn-retake" class="btn btn-secondary">Retake Photo</button>
    </div>
  </div>

  <!-- QR DISPLAY VIEW -->
  <div id="qr-view" class="view hidden">
    <div class="view-header">Generated QR Code</div>
    <div id="qr-container-view">
      <div class="qr-card">
        <div id="qrcode"></div>
      </div>
      <div class="text-editor-card">
        <label>Extracted Text (Tap to edit)</label>
        <div id="result-text" contenteditable="true" spellcheck="false"></div>
      </div>
    </div>
    <div class="action-bar">
      <button id="btn-pick-another" class="btn btn-secondary">Select Another</button>
      <button id="btn-new-photo" class="btn">New Photo</button>
    </div>
  </div>

  <script>
    const video = document.getElementById('video');
    const cameraSelect = document.getElementById('camera-select');
    const cameraViewport = document.getElementById('camera-viewport');
    const cameraView = document.getElementById('camera-view');
    const selectView = document.getElementById('select-view');
    const qrView = document.getElementById('qr-view');
    const capturedImage = document.getElementById('captured-image');
    const overlayContainer = document.getElementById('overlay-container');
    const ocrLoader = document.getElementById('ocr-loader');
    const loaderStatus = document.getElementById('loader-status');
    const resultText = document.getElementById('result-text');
    const qrcodeEl = document.getElementById('qrcode');

    let stream = null;
    let tesseractWorker = null;

    // --- 1. CAMERA SELECTION & ENUMERATION ---
    async function initCameras() {
      try {
        const tempStream = await navigator.mediaDevices.getUserMedia({ video: true });
        tempStream.getTracks().forEach(t => t.stop());

        const devices = await navigator.mediaDevices.enumerateDevices();
        const videoInputs = devices.filter(d => d.kind === 'videoinput');

        cameraSelect.innerHTML = '';
        if (videoInputs.length === 0) {
          cameraSelect.innerHTML = '<option value="">No camera found</option>';
          return;
        }

        let selectedId = videoInputs[0].deviceId;
        videoInputs.forEach((device, index) => {
          const option = document.createElement('option');
          option.value = device.deviceId;
          const label = device.label || `Camera ${index + 1}`;
          option.textContent = label;

          const l = label.toLowerCase();
          if ((l.includes('back') || l.includes('rear') || l.includes('environment')) &&
              !l.includes('wide') && !l.includes('ultra') && !l.includes('macro')) {
            selectedId = device.deviceId;
          }
          cameraSelect.appendChild(option);
        });

        cameraSelect.value = selectedId;
        await startCamera(selectedId);
      } catch (err) {
        alert('Camera access denied or unreadable.');
      }
    }

    // --- 2. FOCUS DISTANCE PROBING & HARDWARE INITIALIZATION ---
    async function startCamera(deviceId) {
      if (stream) stream.getTracks().forEach(t => t.stop());

      const constraints = {
        video: {
          deviceId: deviceId ? { exact: deviceId } : undefined,
          width: { ideal: 3840 },
          height: { ideal: 2160 },
          frameRate: { ideal: 30 }
        },
        audio: false
      };

      try {
        stream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = stream;

        const track = stream.getVideoTracks()[0];
        const capabilities = track.getCapabilities ? track.getCapabilities() : {};
        const advancedConstraints = {};

        // Force continuous auto focus mode
        if (capabilities.focusMode && capabilities.focusMode.includes('continuous')) {
          advancedConstraints.focusMode = 'continuous';
        }

        // Set focus to maximum close range (macro boundary)
        if (capabilities.focusDistance) {
          advancedConstraints.focusDistance = capabilities.focusDistance.max;
        }

        // Apply a minor zoom boost (1.5x) to back off from screen surface while maintaining tight focus
        if (capabilities.zoom) {
          const idealZoom = Math.min(1.5, capabilities.zoom.max);
          advancedConstraints.zoom = Math.max(capabilities.zoom.min, idealZoom);
        }

        if (Object.keys(advancedConstraints).length > 0) {
          await track.applyConstraints({ advanced: [advancedConstraints] }).catch(() => {});
        }

        enableTapToFocus(track, capabilities);
      } catch (err) {
        console.error('Error starting camera:', err);
      }
    }

    cameraSelect.onchange = () => startCamera(cameraSelect.value);

    // --- 3. TAP-TO-FOCUS OVERRIDE ---
    function enableTapToFocus(track, capabilities) {
      cameraViewport.onclick = async (event) => {
        if (!capabilities.focusMode) return;

        try {
          if (capabilities.focusMode.includes('single-shot')) {
            await track.applyConstraints({ advanced: [{ focusMode: 'single-shot' }] });
          } else if (capabilities.focusMode.includes('continuous')) {
            await track.applyConstraints({ advanced: [{ focusMode: 'manual' }] });
            await track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] });
          }
          showFocusRing(event.clientX, event.clientY);
        } catch (e) {
          console.log('Focus re-trigger failed:', e);
        }
      };
    }

    function showFocusRing(x, y) {
      let ring = document.getElementById('focus-ring');
      if (!ring) {
        ring = document.createElement('div');
        ring.id = 'focus-ring';
        ring.style.cssText = `
          position: absolute; width: 60px; height: 60px;
          border: 2px solid #60a5fa; border-radius: 50%;
          pointer-events: none; transform: translate(-50%, -50%) scale(1.4);
          transition: all 0.25s cubic-bezier(0,0,0.2,1); z-index: 30; opacity: 1;
        `;
        cameraViewport.appendChild(ring);
      }
      ring.style.left = `${x}px`;
      ring.style.top = `${y}px`;
      ring.style.opacity = '1';
      ring.style.transform = 'translate(-50%, -50%) scale(1)';
      
      setTimeout(() => { ring.style.opacity = '0'; }, 500);
    }

    // --- 4. MULTI-PASS OCR PIPELINE ---
    function generatePasses(sourceCanvas) {
      const maxDim = 1800;
      let w = sourceCanvas.width;
      let h = sourceCanvas.height;

      if (w > maxDim || h > maxDim) {
        if (w > h) { h = Math.round((h * maxDim) / w); w = maxDim; }
        else { w = Math.round((w * maxDim) / h); h = maxDim; }
      }

      const baseCanvas = document.createElement('canvas');
      baseCanvas.width = w; baseCanvas.height = h;
      const bCtx = baseCanvas.getContext('2d');
      bCtx.drawImage(sourceCanvas, 0, 0, w, h);
      const baseData = bCtx.getImageData(0, 0, w, h);

      // Pass 1: Sharpened Grayscale
      const pass1Canvas = document.createElement('canvas');
      pass1Canvas.width = w; pass1Canvas.height = h;
      const p1Ctx = pass1Canvas.getContext('2d');
      const p1Data = p1Ctx.createImageData(w, h);
      
      const gray = new Float32Array(w * h);
      for (let i = 0, j = 0; i < baseData.data.length; i += 4, j++) {
        gray[j] = baseData.data[i] * 0.299 + baseData.data[i + 1] * 0.587 + baseData.data[i + 2] * 0.114;
      }

      for (let y = 1; y < h - 1; y++) {
        for (let x = 1; x < w - 1; x++) {
          const idx = y * w + x;
          const val = 5 * gray[idx] - gray[idx - w] - gray[idx + w] - gray[idx - 1] - gray[idx + 1];
          const clamped = Math.min(255, Math.max(0, val));
          const pIdx = idx * 4;
          p1Data.data[pIdx] = p1Data.data[pIdx + 1] = p1Data.data[pIdx + 2] = clamped;
          p1Data.data[pIdx + 3] = 255;
        }
      }
      p1Ctx.putImageData(p1Data, 0, 0);

      // Pass 2: Adaptive Sauvola Binarization
      const pass2Canvas = document.createElement('canvas');
      pass2Canvas.width = w; pass2Canvas.height = h;
      const p2Ctx = pass2Canvas.getContext('2d');
      const p2Data = p2Ctx.createImageData(w, h);

      const halfW = 12;
      const k = 0.2;
      const R = 128;

      const integral = new Float64Array((w + 1) * (h + 1));
      const integralSq = new Float64Array((w + 1) * (h + 1));

      for (let y = 0; y < h; y++) {
        let rSum = 0, rSumSq = 0;
        for (let x = 0; x < w; x++) {
          const idx = y * w + x;
          const v = gray[idx];
          rSum += v; rSumSq += v * v;
          const iIdx = (y + 1) * (w + 1) + (x + 1);
          integral[iIdx] = integral[iIdx - (w + 1)] + rSum;
          integralSq[iIdx] = integralSq[iIdx - (w + 1)] + rSumSq;
        }
      }

      for (let y = 0; y < h; y++) {
        const y1 = Math.max(0, y - halfW);
        const y2 = Math.min(h, y + halfW + 1);
        for (let x = 0; x < w; x++) {
          const x1 = Math.max(0, x - halfW);
          const x2 = Math.min(w, x + halfW + 1);
          const count = (x2 - x1) * (y2 - y1);
          
          const stride = w + 1;
          const sum = integral[y2 * stride + x2] - integral[y1 * stride + x2] - integral[y2 * stride + x1] + integral[y1 * stride + x1];
          const sumSq = integralSq[y2 * stride + x2] - integralSq[y1 * stride + x2] - integralSq[y2 * stride + x1] + integralSq[y1 * stride + x1];

          const mean = sum / count;
          const stdDev = Math.sqrt(Math.max(0, (sumSq / count) - (mean * mean)));
          const threshold = mean * (1 + k * ((stdDev / R) - 1));

          const idx = y * w + x;
          const val = gray[idx] < threshold ? 0 : 255;
          const pIdx = idx * 4;
          p2Data.data[pIdx] = p2Data.data[pIdx + 1] = p2Data.data[pIdx + 2] = val;
          p2Data.data[pIdx + 3] = 255;
        }
      }
      p2Ctx.putImageData(p2Data, 0, 0);

      return { pass1Canvas, pass2Canvas, width: w, height: h };
    }

    // --- 5. EXECUTION & SELECTION LOGIC ---
    document.getElementById('btn-capture').onclick = () => {
      if (!video.videoWidth) return;

      const rawCanvas = document.createElement('canvas');
      rawCanvas.width = video.videoWidth;
      rawCanvas.height = video.videoHeight;
      rawCanvas.getContext('2d').drawImage(video, 0, 0);

      capturedImage.src = rawCanvas.toDataURL('image/jpeg', 0.95);

      cameraView.classList.add('hidden');
      selectView.classList.remove('hidden');
      ocrLoader.classList.remove('hidden');
      overlayContainer.innerHTML = '';

      capturedImage.onload = () => runMultiPassOCR(rawCanvas);
    };

    async function runMultiPassOCR(rawCanvas) {
      try {
        loaderStatus.textContent = 'Enhancing image channels...';
        const { pass1Canvas, pass2Canvas, width, height } = generatePasses(rawCanvas);

        if (!tesseractWorker) {
          tesseractWorker = await Tesseract.createWorker('eng');
        }

        await tesseractWorker.setParameters({
          tessedit_pageseg_mode: Tesseract.PSM.SPARSE_TEXT,
          preserve_interword_spaces: '1'
        });

        loaderStatus.textContent = 'Running Pass 1 (Grayscale)...';
        const res1 = await tesseractWorker.recognize(pass1Canvas);

        loaderStatus.textContent = 'Running Pass 2 (Binarized)...';
        const res2 = await tesseractWorker.recognize(pass2Canvas);

        const combined = mergeOCRResults(res1.data.words || [], res2.data.words || []);
        renderBoundingBoxes(combined, width, height);
      } catch (err) {
        alert('Error processing screen text.');
        console.error(err);
      } finally {
        ocrLoader.classList.add('hidden');
      }
    }

    function mergeOCRResults(words1, words2) {
      const all = [...words1, ...words2];
      const merged = [];

      all.forEach(word => {
        const text = word.text.trim();
        if (text.length < 2 || word.confidence < 45) return;

        const duplicate = merged.find(existing => {
          const overlapX = Math.abs(existing.bbox.x0 - word.bbox.x0) < 15;
          const overlapY = Math.abs(existing.bbox.y0 - word.bbox.y0) < 15;
          return overlapX && overlapY;
        });

        if (!duplicate) {
          merged.push(word);
        } else if (word.confidence > duplicate.confidence) {
          const idx = merged.indexOf(duplicate);
          merged[idx] = word;
        }
      });

      return merged;
    }

    function renderBoundingBoxes(words, imgWidth, imgHeight) {
      overlayContainer.innerHTML = '';
      const rect = capturedImage.getBoundingClientRect();
      const scaleX = rect.width / imgWidth;
      const scaleY = rect.height / imgHeight;

      words.forEach(word => {
        const cleanText = word.text.trim();
        const box = document.createElement('div');
        box.className = 'box-target';
        box.style.left = `${word.bbox.x0 * scaleX}px`;
        box.style.top = `${word.bbox.y0 * scaleY}px`;
        box.style.width = `${(word.bbox.x1 - word.bbox.x0) * scaleX}px`;
        box.style.height = `${(word.bbox.y1 - word.bbox.y0) * scaleY}px`;

        box.onclick = () => selectText(cleanText);
        overlayContainer.appendChild(box);
      });
    }

    function selectText(text) {
      selectView.classList.add('hidden');
      qrView.classList.remove('hidden');
      resultText.textContent = text;
      renderQRCode(text);
    }

    function renderQRCode(text) {
      qrcodeEl.innerHTML = '';
      new QRCode(qrcodeEl, {
        text: text || ' ',
        width: 220,
        height: 220,
        colorDark: "#000000",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.H
      });
    }

    resultText.oninput = () => renderQRCode(resultText.textContent);

    document.getElementById('btn-retake').onclick = resetToCamera;
    document.getElementById('btn-new-photo').onclick = resetToCamera;
    document.getElementById('btn-pick-another').onclick = () => {
      qrView.classList.add('hidden');
      selectView.classList.remove('hidden');
    };

    function resetToCamera() {
      selectView.classList.add('hidden');
      qrView.classList.add('hidden');
      cameraView.classList.remove('hidden');
      overlayContainer.innerHTML = '';
    }

    window.onload = initCameras;
  </script>
</body>
</html>

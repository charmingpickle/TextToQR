<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BIOS Scanner</title>
    
    <!-- Libraries -->
    <script src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: Arial, sans-serif;
            background: #000;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            touch-action: manipulation;
        }
        
        /* Camera Screen */
        #cameraScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        
        #cameraFeed {
            flex: 1;
            width: 100%;
            object-fit: cover;
            background: #000;
        }
        
        /* Simple controls at bottom */
        #controls {
            padding: 15px;
            background: rgba(0,0,0,0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }
        
        #shutterBtn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: white;
            border: 3px solid #007bff;
            cursor: pointer;
            font-size: 0;
        }
        
        #shutterBtn:active {
            background: #007bff;
        }
        
        .small-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: none;
            background: rgba(255,255,255,0.2);
            color: white;
            font-size: 20px;
            cursor: pointer;
        }
        
        /* Selection Screen */
        #selectionScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #1a1a1a;
            display: none;
            flex-direction: column;
        }
        
        #selectionHeader {
            padding: 10px;
            background: #2a2a2a;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        #selectionHeader button {
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            background: #007bff;
            color: white;
            font-size: 14px;
            cursor: pointer;
        }
        
        #imageScroll {
            flex: 1;
            overflow: auto;
            position: relative;
        }
        
        #processedImage {
            width: 100%;
            display: block;
        }
        
        /* Text selection overlay */
        .text-box {
            position: absolute;
            border: 2px solid #00ff00;
            background: rgba(0, 255, 0, 0.2);
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .text-box:active {
            background: rgba(0, 255, 0, 0.4);
        }
        
        .text-box.selected {
            background: rgba(0, 255, 0, 0.5);
            border: 3px solid #00ff00;
        }
        
        /* Bottom panel */
        #bottomPanel {
            background: #2a2a2a;
            padding: 10px;
            min-height: 100px;
            max-height: 200px;
            overflow-y: auto;
        }
        
        #selectedText {
            color: #00ff00;
            font-size: 16px;
            font-family: monospace;
            margin-bottom: 5px;
            word-break: break-all;
        }
        
        #qrContainer {
            display: none;
            text-align: center;
            margin-top: 5px;
        }
        
        #qrContainer canvas {
            background: white;
            padding: 5px;
            border-radius: 5px;
        }
        
        #processing {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 20px;
            z-index: 100;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #333;
            border-top: 4px solid #007bff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        #processingText {
            color: white;
            font-size: 18px;
        }
        
        /* Notification */
        #notification {
            position: fixed;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            z-index: 1000;
            display: none;
        }
    </style>
</head>
<body>
    <!-- Camera Screen -->
    <div id="cameraScreen">
        <video id="cameraFeed" autoplay playsinline></video>
        
        <div id="controls">
            <button class="small-btn" onclick="switchCamera()">🔄</button>
            <button id="shutterBtn" onclick="takePhoto()"></button>
            <button class="small-btn" onclick="toggleFlash()">⚡</button>
        </div>
    </div>
    
    <!-- Processing Overlay -->
    <div id="processing">
        <div class="spinner"></div>
        <div id="processingText">Processing...</div>
    </div>
    
    <!-- Selection Screen -->
    <div id="selectionScreen">
        <div id="selectionHeader">
            <button onclick="retakePhoto()">📸 Retake</button>
            <span style="color:white; font-weight:bold;">Tap Text to Select</span>
            <button onclick="clearSelection()">Clear</button>
        </div>
        
        <div id="imageScroll">
            <img id="processedImage" alt="Processed Image">
            <div id="textOverlay"></div>
        </div>
        
        <div id="bottomPanel">
            <div id="selectedText">Tap on text in the image</div>
            <div id="qrContainer">
                <canvas id="qrCanvas"></canvas>
            </div>
        </div>
    </div>
    
    <!-- Notification -->
    <div id="notification"></div>
    
    <script>
        // Simple camera setup
        let video = document.getElementById('cameraFeed');
        let stream = null;
        let facingMode = 'environment'; // Try back camera first
        let flashOn = false;
        let imageWidth = 0;
        let imageHeight = 0;
        let wordBoxes = [];
        
        // Initialize camera
        async function initCamera() {
            try {
                // Stop existing stream
                if (stream) {
                    stream.getTracks().forEach(track => track.stop());
                }
                
                // Try to get camera with specific constraints
                const constraints = {
                    video: {
                        facingMode: facingMode,
                        width: { ideal: 1920 },
                        height: { ideal: 1080 }
                    },
                    audio: false
                };
                
                stream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = stream;
                
                // Log what camera we got
                const track = stream.getVideoTracks()[0];
                console.log('Camera:', track.label);
                
            } catch (error) {
                console.error('Camera error:', error);
                
                // Simple fallback
                try {
                    stream = await navigator.mediaDevices.getUserMedia({ video: true });
                    video.srcObject = stream;
                } catch (err) {
                    showNotification('Camera access denied');
                }
            }
        }
        
        // Switch camera
        async function switchCamera() {
            facingMode = facingMode === 'environment' ? 'user' : 'environment';
            await initCamera();
        }
        
        // Toggle flash
        async function toggleFlash() {
            try {
                if (stream) {
                    const track = stream.getVideoTracks()[0];
                    const capabilities = track.getCapabilities();
                    
                    if (capabilities.torch) {
                        flashOn = !flashOn;
                        await track.applyConstraints({
                            advanced: [{ torch: flashOn }]
                        });
                        showNotification(flashOn ? 'Flash ON' : 'Flash OFF');
                    } else {
                        showNotification('No flash on this camera');
                    }
                }
            } catch (error) {
                console.error('Flash error:', error);
            }
        }
        
        // Take photo
        async function takePhoto() {
            try {
                // Show processing
                document.getElementById('processing').style.display = 'flex';
                document.getElementById('processingText').textContent = 'Capturing...';
                
                // Create canvas from video
                const canvas = document.createElement('canvas');
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0);
                
                // Process image
                document.getElementById('processingText').textContent = 'Processing image...';
                const processedCanvas = await processImage(canvas);
                
                // Run OCR
                document.getElementById('processingText').textContent = 'Reading text...';
                const ocrData = await runOCR(processedCanvas);
                
                // Show selection screen
                showSelectionScreen(processedCanvas, ocrData);
                
                // Hide processing
                document.getElementById('processing').style.display = 'none';
                
            } catch (error) {
                console.error('Photo error:', error);
                document.getElementById('processing').style.display = 'none';
                showNotification('Failed to process image');
            }
        }
        
        // Process image to black and white
        async function processImage(canvas) {
            const ctx = canvas.getContext('2d');
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;
            
            // Convert to grayscale
            for (let i = 0; i < data.length; i += 4) {
                const gray = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
                // Simple threshold
                const bw = gray > 140 ? 255 : 0;
                data[i] = bw;
                data[i + 1] = bw;
                data[i + 2] = bw;
            }
            
            ctx.putImageData(imageData, 0, 0);
            
            // Upscale for better OCR
            const scale = 2;
            const upscaled = document.createElement('canvas');
            upscaled.width = canvas.width * scale;
            upscaled.height = canvas.height * scale;
            const upCtx = upscaled.getContext('2d');
            upCtx.scale(scale, scale);
            upCtx.drawImage(canvas, 0, 0);
            
            return upscaled;
        }
        
        // Run OCR
        async function runOCR(canvas) {
            try {
                const result = await Tesseract.recognize(
                    canvas,
                    'eng',
                    {
                        tessedit_char_whitelist: 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789:-. /',
                        tessedit_pageseg_mode: '6'
                    }
                );
                
                return result.data;
            } catch (error) {
                console.error('OCR error:', error);
                return null;
            }
        }
        
        // Show selection screen
        function showSelectionScreen(canvas, ocrData) {
            // Save dimensions
            imageWidth = canvas.width;
            imageHeight = canvas.height;
            
            // Hide camera
            document.getElementById('cameraScreen').style.display = 'none';
            
            // Show selection screen
            document.getElementById('selectionScreen').style.display = 'flex';
            
            // Set image
            const img = document.getElementById('processedImage');
            img.src = canvas.toDataURL();
            
            // Clear previous boxes
            document.getElementById('textOverlay').innerHTML = '';
            wordBoxes = [];
            
            // Create clickable text boxes from OCR words
            if (ocrData && ocrData.words) {
                createTextBoxes(ocrData.words);
            } else if (ocrData && ocrData.text) {
                // Fallback: show raw text
                showRawText(ocrData.text);
            }
        }
        
        // Create clickable text boxes
        function createTextBoxes(words) {
            const overlay = document.getElementById('textOverlay');
            
            // Group words into lines
            const lines = groupWordsIntoLines(words);
            
            lines.forEach((line, index) => {
                if (line.text.trim().length < 3) return; // Skip very short lines
                
                const box = document.createElement('div');
                box.className = 'text-box';
                box.textContent = line.text;
                box.style.position = 'absolute';
                box.style.left = (line.x / imageWidth * 100) + '%';
                box.style.top = (line.y / imageHeight * 100) + '%';
                box.style.width = (line.width / imageWidth * 100) + '%';
                box.style.height = (line.height / imageHeight * 100) + '%';
                box.style.fontSize = '14px';
                box.style.color = 'transparent';
                box.style.overflow = 'hidden';
                
                box.addEventListener('click', () => selectText(line.text, box));
                
                overlay.appendChild(box);
                wordBoxes.push({ box, text: line.text });
            });
            
            if (wordBoxes.length === 0) {
                showNotification('No text detected. Try closer photo.');
            }
        }
        
        // Group words into lines
        function groupWordsIntoLines(words) {
            const lines = [];
            let currentLine = null;
            
            words.forEach(word => {
                const y = word.bbox.y0;
                const height = word.bbox.y1 - word.bbox.y0;
                
                if (!currentLine || Math.abs(y - currentLine.y) > height * 0.5) {
                    // New line
                    currentLine = {
                        text: word.text,
                        x: word.bbox.x0,
                        y: word.bbox.y0,
                        width: word.bbox.x1 - word.bbox.x0,
                        height: word.bbox.y1 - word.bbox.y0
                    };
                    lines.push(currentLine);
                } else {
                    // Same line
                    currentLine.text += ' ' + word.text;
                    currentLine.width = word.bbox.x1 - currentLine.x;
                    currentLine.height = Math.max(currentLine.height, word.bbox.y1 - word.bbox.y0);
                }
            });
            
            return lines;
        }
        
        // Fallback: show raw text as list
        function showRawText(text) {
            const overlay = document.getElementById('textOverlay');
            
            const lines = text.split('\n').filter(line => line.trim().length > 0);
            
            lines.forEach((line, index) => {
                if (line.trim().length < 3) return;
                
                const div = document.createElement('div');
                div.style.padding = '10px';
                div.style.margin = '5px';
                div.style.background = '#333';
                div.style.color = 'white';
                div.style.cursor = 'pointer';
                div.style.borderRadius = '5px';
                div.textContent = line.trim();
                
                div.addEventListener('click', () => selectText(line.trim(), div));
                
                overlay.appendChild(div);
            });
            
            // Change overlay position for list mode
            overlay.style.position = 'relative';
            overlay.style.padding = '10px';
        }
        
        // Select text
        async function selectText(text, element) {
            try {
                // Clean text
                const cleanText = text.trim();
                
                if (!cleanText) return;
                
                // Update selected text display
                document.getElementById('selectedText').textContent = cleanText;
                
                // Highlight selected box
                if (element) {
                    document.querySelectorAll('.text-box').forEach(box => {
                        box.classList.remove('selected');
                    });
                    
                    if (element.classList) {
                        element.classList.add('selected');
                    }
                }
                
                // Generate QR code
                const qrContainer = document.getElementById('qrContainer');
                qrContainer.style.display = 'block';
                
                const qrCanvas = document.getElementById('qrCanvas');
                await QRCode.toCanvas(qrCanvas, cleanText, {
                    width: 100,
                    margin: 2,
                    errorCorrectionLevel: 'H'
                });
                
                // Vibrate if supported
                if (navigator.vibrate) {
                    navigator.vibrate(50);
                }
                
                // Copy to clipboard automatically
                try {
                    await navigator.clipboard.writeText(cleanText);
                    showNotification('Copied: ' + cleanText);
                } catch (err) {
                    // Clipboard might not work without HTTPS
                }
                
            } catch (error) {
                console.error('Selection error:', error);
            }
        }
        
        // Clear selection
        function clearSelection() {
            document.getElementById('selectedText').textContent = 'Tap on text in the image';
            document.getElementById('qrContainer').style.display = 'none';
            document.querySelectorAll('.text-box').forEach(box => {
                box.classList.remove('selected');
            });
        }
        
        // Retake photo
        function retakePhoto() {
            document.getElementById('selectionScreen').style.display = 'none';
            document.getElementById('cameraScreen').style.display = 'flex';
            clearSelection();
            
            // Restart camera
            setTimeout(() => {
                initCamera();
            }, 100);
        }
        
        // Show notification
        function showNotification(message) {
            const notification = document.getElementById('notification');
            notification.textContent = message;
            notification.style.display = 'block';
            
            setTimeout(() => {
                notification.style.display = 'none';
            }, 2000);
        }
        
        // Initialize on page load
        window.addEventListener('DOMContentLoaded', () => {
            initCamera();
        });
        
        // Handle visibility change (when app goes to background)
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                // Stop camera when hidden
                if (stream) {
                    stream.getTracks().forEach(track => track.stop());
                }
            } else {
                // Restart camera when visible
                initCamera();
            }
        });
    </script>
</body>
</html>

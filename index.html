<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#09090b" />
  <title>BIOS → QR Engine (Real OCR)</title>

  <!-- QR Code Generator -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <!-- Fast Bundle OCR Engine -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <style>
    :root {
      --bg-main: #09090b;
      --bg-surface: #18181b;
      --bg-card: #27272a;
      --accent-color: #3b82f6;
      --accent-hover: #2563eb;
      --text-main: #f4f4f5;
      --text-muted: #a1a1aa;
      --border-color: #3f3f46;
      --box-highlight: rgba(59, 130, 246, 0.35);
      --box-border: #60a5fa;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-main);
      color: var(--text-main);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .view {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      width: 100%; height: 100dvh;
      overflow: hidden;
    }

    .viewport {
      flex: 1;
      position: relative;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    video, #captured-image {
      width: 100%; height: 100%;
      object-fit: contain;
    }

    .top-bar {
      position: absolute;
      top: 16px; left: 16px; right: 16px;
      z-index: 15;
      display: flex;
      justify-content: center;
    }

    .camera-select {
      background: rgba(24, 24, 27, 0.85);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      backdrop-filter: blur(10px);
      outline: none;
      max-width: 90%;
      text-overflow: ellipsis;
    }

    .view-finder {
      position: absolute;
      width: 85%; height: 60%;
      border: 2px dashed rgba(255, 255, 255, 0.3);
      border-radius: 12px;
      pointer-events: none;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.55);
    }

    #overlay-container {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: auto;
    }

    .bios-box {
      position: absolute;
      border: 1.5px solid var(--box-border);
      background: var(--box-highlight);
      border-radius: 2px;
      cursor: pointer;
      box-shadow: 0 0 4px rgba(59, 130, 246, 0.4);
      transition: background 0.1s ease;
    }

    .bios-box:active {
      background: rgba(59, 130, 246, 0.7);
      border-color: #ffffff;
    }

    .loader-overlay {
      position: absolute;
      inset: 0;
      background: rgba(9, 9, 11, 0.85);
      backdrop-filter: blur(6px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 50;
      gap: 12px;
    }

    .spinner {
      width: 36px; height: 36px;
      border: 3px solid var(--border-color);
      border-top-color: var(--accent-color);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .control-bar {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 24px 32px 40px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
      z-index: 10;
    }

    .shutter-btn {
      width: 76px; height: 76px;
      border-radius: 50%;
      border: 4px solid #fff;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      outline: none;
    }

    .shutter-btn:active { transform: scale(0.94); }

    .shutter-btn-inner {
      width: 58px; height: 58px;
      border-radius: 50%;
      background: #fff;
    }

    .view-header {
      padding: 16px 20px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-color);
      text-align: center;
      font-weight: 600;
      font-size: 0.95rem;
    }

    .action-bar {
      padding: 16px 20px 28px;
      background: var(--bg-surface);
      border-top: 1px solid var(--border-color);
      display: flex;
      gap: 12px;
    }

    button.btn {
      flex: 1;
      background: var(--accent-color);
      color: white;
      border: none;
      padding: 14px 20px;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
    }

    button.btn-secondary {
      background: var(--bg-card);
      color: var(--text-main);
      border: 1px solid var(--border-color);
    }

    #qr-container-view {
      flex: 1;
      overflow-y: auto;
      padding: 32px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
    }

    .qr-card {
      background: #ffffff;
      padding: 20px;
      border-radius: 16px;
    }

    .text-editor-card {
      width: 100%; max-width: 360px;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .text-editor-card label {
      font-size: 0.75rem;
      text-transform: uppercase;
      color: var(--text-muted);
      font-weight: 700;
    }

    #result-text {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 1.1rem;
      color: var(--text-main);
      outline: none;
      word-break: break-all;
      min-height: 1.5em;
      user-select: text;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- CAMERA VIEW -->
  <div id="camera-view" class="view">
    <div class="top-bar">
      <select id="camera-select" class="camera-select">
        <option value="">Detecting cameras...</option>
      </select>
    </div>
    <div class="viewport">
      <video id="video" autoplay playsinline muted></video>
      <div class="view-finder"></div>
    </div>
    <div class="control-bar">
      <button class="shutter-btn" id="btn-capture" aria-label="Take Photo">
        <div class="shutter-btn-inner"></div>
      </button>
    </div>
  </div>

  <!-- SELECTION VIEW -->
  <div id="select-view" class="view hidden">
    <div class="view-header">Tap BIOS serial number line</div>
    <div class="viewport">
      <img id="captured-image" alt="Captured BIOS screen" />
      <div id="overlay-container"></div>
      <div id="ocr-loader" class="loader-overlay hidden">
        <div class="spinner"></div>
        <div style="font-size: 0.85rem; font-weight: 500;">Reading Text Characters...</div>
      </div>
    </div>
    <div class="action-bar">
      <button id="btn-retake" class="btn btn-secondary">Retake Photo</button>
    </div>
  </div>

  <!-- QR DISPLAY VIEW -->
  <div id="qr-view" class="view hidden">
    <div class="view-header">Generated QR Code</div>
    <div id="qr-container-view">
      <div class="qr-card">
        <div id="qrcode"></div>
      </div>
      <div class="text-editor-card">
        <label>Line Data (Tap to edit)</label>
        <div id="result-text" contenteditable="true" spellcheck="false"></div>
      </div>
    </div>
    <div class="action-bar">
      <button id="btn-pick-another" class="btn btn-secondary">Select Another Line</button>
      <button id="btn-new-photo" class="btn">New Photo</button>
    </div>
  </div>

  <script>
    let stream = null;
    let currentCanvas = null;
    let ocrWorker = null;

    const video = document.getElementById('video');
    const cameraSelect = document.getElementById('camera-select');
    const cameraView = document.getElementById('camera-view');
    const selectView = document.getElementById('select-view');
    const qrView = document.getElementById('qr-view');
    const capturedImage = document.getElementById('captured-image');
    const overlayContainer = document.getElementById('overlay-container');
    const ocrLoader = document.getElementById('ocr-loader');
    const resultText = document.getElementById('result-text');
    const qrcodeEl = document.getElementById('qrcode');

    // Pre-initialize lightweight worker in background
    async function initOCRWorker() {
      if (!ocrWorker) {
        ocrWorker = await Tesseract.createWorker('eng');
      }
    }

    async function initCameras() {
      initOCRWorker();
      try {
        const tempStream = await navigator.mediaDevices.getUserMedia({ video: true });
        tempStream.getTracks().forEach(t => t.stop());

        const devices = await navigator.mediaDevices.enumerateDevices();
        const videoInputs = devices.filter(d => d.kind === 'videoinput');

        cameraSelect.innerHTML = '';
        if (!videoInputs.length) return;

        let selectedId = videoInputs[0].deviceId;
        videoInputs.forEach((device, index) => {
          const option = document.createElement('option');
          option.value = device.deviceId;
          option.textContent = device.label || `Camera ${index + 1}`;
          
          const label = (device.label || '').toLowerCase();
          if ((label.includes('back') || label.includes('rear')) && !label.includes('wide')) {
            selectedId = device.deviceId;
          }
          cameraSelect.appendChild(option);
        });

        cameraSelect.value = selectedId;
        await startCamera(selectedId);
      } catch (err) {
        alert('Camera permissions required.');
      }
    }

    async function startCamera(deviceId) {
      if (stream) stream.getTracks().forEach(t => t.stop());
      stream = await navigator.mediaDevices.getUserMedia({
        video: { deviceId: deviceId ? { exact: deviceId } : undefined, width: { ideal: 3840 }, height: { ideal: 2160 } },
        audio: false
      });
      video.srcObject = stream;
    }

    cameraSelect.onchange = () => startCamera(cameraSelect.value);

    document.getElementById('btn-capture').onclick = () => {
      if (!video.videoWidth) return;

      currentCanvas = document.createElement('canvas');
      currentCanvas.width = video.videoWidth;
      currentCanvas.height = video.videoHeight;
      const ctx = currentCanvas.getContext('2d');
      ctx.drawImage(video, 0, 0);

      capturedImage.src = currentCanvas.toDataURL('image/jpeg', 0.95);

      cameraView.classList.add('hidden');
      selectView.classList.remove('hidden');

      capturedImage.onload = () => processBiosTextLines(currentCanvas);
    };

    function processBiosTextLines(canvas) {
      const ctx = canvas.getContext('2d');
      const width = canvas.width;
      const height = canvas.height;
      const imgData = ctx.getImageData(0, 0, width, height);
      const data = imgData.data;

      // Group horizontal contrast rows into selectable target boxes
      const rowVariance = new Float32Array(height);
      for (let y = 0; y < height; y++) {
        let sumDiff = 0;
        let prevLuma = 0;
        for (let x = 0; x < width; x += 4) {
          const idx = (y * width + x) * 4;
          const luma = data[idx] * 0.299 + data[idx+1] * 0.587 + data[idx+2] * 0.114;
          if (x > 0) sumDiff += Math.abs(luma - prevLuma);
          prevLuma = luma;
        }
        rowVariance[y] = sumDiff / (width / 4);
      }

      const boxes = [];
      let inLine = false;
      let startY = 0;
      const minLineHeight = Math.round(height * 0.010);
      const maxLineHeight = Math.round(height * 0.050);

      for (let y = 0; y < height; y++) {
        const hasTextContrast = rowVariance[y] > 14;

        if (hasTextContrast && !inLine) {
          inLine = true;
          startY = y;
        } else if (!hasTextContrast && inLine) {
          const lineHeight = y - startY;
          if (lineHeight >= minLineHeight && lineHeight <= maxLineHeight) {
            boxes.push({
              x: Math.round(width * 0.05),
              y: Math.max(0, startY - 4),
              w: Math.round(width * 0.90),
              h: lineHeight + 8
            });
          }
          inLine = false;
        }
      }

      renderBiosBoxes(boxes, width, height);
    }

    function renderBiosBoxes(boxes, imgWidth, imgHeight) {
      overlayContainer.innerHTML = '';
      const rect = capturedImage.getBoundingClientRect();
      const scaleX = rect.width / imgWidth;
      const scaleY = rect.height / imgHeight;

      boxes.forEach(b => {
        const box = document.createElement('div');
        box.className = 'bios-box';
        box.style.left = `${b.x * scaleX}px`;
        box.style.top = `${b.y * scaleY}px`;
        box.style.width = `${b.w * scaleX}px`;
        box.style.height = `${b.h * scaleY}px`;

        box.onclick = () => extractTextFromBox(b);
        overlayContainer.appendChild(box);
      });
    }

    async function extractTextFromBox(box) {
      ocrLoader.classList.remove('hidden');

      try {
        // Crop selected bounding box into standalone canvas
        const cropCanvas = document.createElement('canvas');
        cropCanvas.width = box.w;
        cropCanvas.height = box.h;
        const cropCtx = cropCanvas.getContext('2d');
        cropCtx.drawImage(currentCanvas, box.x, box.y, box.w, box.h, 0, 0, box.w, box.h);

        // Perform fast OCR read on tiny crop slice
        if (!ocrWorker) await initOCRWorker();
        const { data } = await ocrWorker.recognize(cropCanvas);
        
        // Clean output string (removes linebreaks/spaces)
        let extractedString = (data.text || '').replace(/[\r\n]+/g, ' ').trim();

        if (!extractedString) {
          extractedString = "NO_TEXT_FOUND";
        }

        selectView.classList.add('hidden');
        qrView.classList.remove('hidden');
        resultText.textContent = extractedString;
        renderQRCode(extractedString);

      } catch (err) {
        alert('OCR Read Failed');
        console.error(err);
      } finally {
        ocrLoader.classList.add('hidden');
      }
    }

    function renderQRCode(text) {
      qrcodeEl.innerHTML = '';
      new QRCode(qrcodeEl, {
        text: text || ' ',
        width: 220,
        height: 220,
        colorDark: "#000000",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.H
      });
    }

    resultText.oninput = () => renderQRCode(resultText.textContent);

    document.getElementById('btn-retake').onclick = resetToCamera;
    document.getElementById('btn-new-photo').onclick = resetToCamera;
    document.getElementById('btn-pick-another').onclick = () => {
      qrView.classList.add('hidden');
      selectView.classList.remove('hidden');
    };

    function resetToCamera() {
      selectView.classList.add('hidden');
      qrView.classList.add('hidden');
      cameraView.classList.remove('hidden');
      overlayContainer.innerHTML = '';
    }

    window.onload = initCameras;
  </script>
</body>
</html>

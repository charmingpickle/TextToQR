<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#09090b" />
  <title>Tap → QR Pro (PaddleOCR Self-Installer)</title>

  <!-- QR Code Generator -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <!-- ONNX Runtime Web Engine for WebAssembly Execution -->
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.18.0/dist/ort.min.js"></script>

  <style>
    :root {
      --bg-main: #09090b;
      --bg-surface: #18181b;
      --bg-card: #27272a;
      --accent-color: #3b82f6;
      --accent-hover: #2563eb;
      --text-main: #f4f4f5;
      --text-muted: #a1a1aa;
      --border-color: #3f3f46;
      --box-highlight: rgba(59, 130, 246, 0.35);
      --box-border: #60a5fa;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-main);
      color: var(--text-main);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .view {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
    }

    .viewport {
      flex: 1;
      position: relative;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    video, #captured-image {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .top-bar {
      position: absolute;
      top: 16px;
      left: 16px;
      right: 16px;
      z-index: 15;
      display: flex;
      justify-content: center;
    }

    .camera-select {
      background: rgba(24, 24, 27, 0.85);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      backdrop-filter: blur(10px);
      outline: none;
      max-width: 90%;
      text-overflow: ellipsis;
    }

    .view-finder {
      position: absolute;
      width: 80%;
      height: 45%;
      border: 2px dashed rgba(255, 255, 255, 0.4);
      border-radius: 16px;
      pointer-events: none;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.55);
    }

    #overlay-container {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: auto;
    }

    .box-target {
      position: absolute;
      border: 2px solid var(--box-border);
      background: var(--box-highlight);
      border-radius: 4px;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      transition: transform 0.1s ease, background 0.15s ease;
    }

    .box-target:active {
      transform: scale(0.97);
      background: rgba(59, 130, 246, 0.65);
      border-color: #ffffff;
    }

    .loader-overlay {
      position: absolute;
      inset: 0;
      background: rgba(9, 9, 11, 0.92);
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 50;
      gap: 16px;
      padding: 24px;
      text-align: center;
    }

    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid var(--border-color);
      border-top-color: var(--accent-color);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .control-bar {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 24px 32px 40px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
      z-index: 10;
    }

    .shutter-btn {
      width: 80px; height: 80px;
      border-radius: 50%;
      border: 4px solid #fff;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      outline: none;
      transition: transform 0.1s ease;
    }

    .shutter-btn:active { transform: scale(0.92); }

    .shutter-btn-inner {
      width: 62px; height: 62px;
      border-radius: 50%;
      background: #fff;
    }

    .view-header {
      padding: 18px 20px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-color);
      text-align: center;
      font-weight: 600;
      font-size: 1.05rem;
    }

    .action-bar {
      padding: 16px 20px 28px;
      background: var(--bg-surface);
      border-top: 1px solid var(--border-color);
      display: flex;
      gap: 12px;
    }

    button.btn {
      flex: 1;
      background: var(--accent-color);
      color: white;
      border: none;
      padding: 14px 20px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.15s ease;
    }

    button.btn:active { background: var(--accent-hover); }

    button.btn-secondary {
      background: var(--bg-card);
      color: var(--text-main);
      border: 1px solid var(--border-color);
    }

    #qr-container-view {
      flex: 1;
      overflow-y: auto;
      padding: 32px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
    }

    .qr-card {
      background: #ffffff;
      padding: 20px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .text-editor-card {
      width: 100%;
      max-width: 360px;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .text-editor-card label {
      font-size: 0.75rem;
      text-transform: uppercase;
      color: var(--text-muted);
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    #result-text {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 1.15rem;
      color: var(--text-main);
      outline: none;
      word-break: break-all;
      min-height: 1.5em;
      user-select: text;
    }

    .progress-bar-container {
      width: 80%;
      max-width: 280px;
      height: 6px;
      background: var(--bg-card);
      border-radius: 3px;
      overflow: hidden;
      margin-top: 8px;
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background: var(--accent-color);
      transition: width 0.2s ease;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- FIRST-BOOT INSTALLER OVERLAY -->
  <div id="installer-overlay" class="loader-overlay">
    <div style="font-size: 1.3rem; font-weight: 700;">PaddleOCR First Boot</div>
    <div style="font-size: 0.9rem; color: var(--text-muted); max-width: 280px;">
      Downloads PaddleOCR execution engine and neural models directly to browser cache (~8MB).
    </div>
    <button id="btn-install" class="btn" style="max-width: 200px; margin-top: 12px;">Initialize Engine</button>
    <div id="install-status-container" class="hidden" style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
      <div class="spinner"></div>
      <div id="install-status-text" style="font-size: 0.85rem; color: var(--text-muted);">Downloading engine binaries...</div>
      <div class="progress-bar-container">
        <div id="install-progress" class="progress-bar"></div>
      </div>
    </div>
  </div>

  <!-- CAMERA VIEW -->
  <div id="camera-view" class="view">
    <div class="top-bar">
      <select id="camera-select" class="camera-select">
        <option value="">Detecting cameras...</option>
      </select>
    </div>
    <div class="viewport" id="camera-viewport">
      <video id="video" autoplay playsinline muted></video>
      <div class="view-finder"></div>
    </div>
    <div class="control-bar">
      <button class="shutter-btn" id="btn-capture" aria-label="Take Photo">
        <div class="shutter-btn-inner"></div>
      </button>
    </div>
  </div>

  <!-- OCR TARGET SELECTION VIEW -->
  <div id="select-view" class="view hidden">
    <div class="view-header">Tap text block to convert to QR</div>
    <div class="viewport" id="select-viewport">
      <img id="captured-image" alt="Captured screen" />
      <div id="overlay-container"></div>
      <div id="ocr-loader" class="loader-overlay hidden">
        <div class="spinner"></div>
        <div style="font-weight: 500;" id="loader-status">Running PaddleOCR Inference...</div>
      </div>
    </div>
    <div class="action-bar">
      <button id="btn-retake" class="btn btn-secondary">Retake Photo</button>
    </div>
  </div>

  <!-- QR DISPLAY VIEW -->
  <div id="qr-view" class="view hidden">
    <div class="view-header">Generated QR Code</div>
    <div id="qr-container-view">
      <div class="qr-card">
        <div id="qrcode"></div>
      </div>
      <div class="text-editor-card">
        <label>Extracted Text (Tap to edit)</label>
        <div id="result-text" contenteditable="true" spellcheck="false"></div>
      </div>
    </div>
    <div class="action-bar">
      <button id="btn-pick-another" class="btn btn-secondary">Select Another</button>
      <button id="btn-new-photo" class="btn">New Photo</button>
    </div>
  </div>

  <script type="module">
    import { PaddleOCR } from 'https://cdn.jsdelivr.net/npm/@paddleocr/paddleocr-js@1.0.3/+esm';

    let ocrEngine = null;
    let stream = null;

    const installerOverlay = document.getElementById('installer-overlay');
    const btnInstall = document.getElementById('btn-install');
    const installStatusContainer = document.getElementById('install-status-container');
    const installStatusText = document.getElementById('install-status-text');
    const installProgress = document.getElementById('install-progress');

    const video = document.getElementById('video');
    const cameraSelect = document.getElementById('camera-select');
    const cameraViewport = document.getElementById('camera-viewport');
    const cameraView = document.getElementById('camera-view');
    const selectView = document.getElementById('select-view');
    const qrView = document.getElementById('qr-view');
    const capturedImage = document.getElementById('captured-image');
    const overlayContainer = document.getElementById('overlay-container');
    const ocrLoader = document.getElementById('ocr-loader');
    const loaderStatus = document.getElementById('loader-status');
    const resultText = document.getElementById('result-text');
    const qrcodeEl = document.getElementById('qrcode');

    // First Boot Installer Logic
    btnInstall.onclick = async () => {
      btnInstall.classList.add('hidden');
      installStatusContainer.classList.remove('hidden');

      try {
        installStatusText.textContent = "Loading WASM & PP-OCRv6 Models...";
        installProgress.style.width = "40%";

        // Download and initialize local WebAssembly Paddle Engine
        ocrEngine = await PaddleOCR.create({
          lang: 'ch',
          ocrVersion: 'PP-OCRv6',
          ortOptions: { backend: 'wasm' }
        });

        installProgress.style.width = "100%";
        installStatusText.textContent = "Engine Ready!";
        
        setTimeout(() => {
          installerOverlay.classList.add('hidden');
          initCameras();
        }, 400);

      } catch (err) {
        console.error(err);
        installStatusText.textContent = "Initialization failed. Check internet connection.";
        btnInstall.classList.remove('hidden');
        btnInstall.textContent = "Retry Setup";
      }
    };

    async function initCameras() {
      try {
        const tempStream = await navigator.mediaDevices.getUserMedia({ video: true });
        tempStream.getTracks().forEach(t => t.stop());

        const devices = await navigator.mediaDevices.enumerateDevices();
        const videoInputs = devices.filter(d => d.kind === 'videoinput');

        cameraSelect.innerHTML = '';
        if (videoInputs.length === 0) return;

        let selectedId = videoInputs[0].deviceId;
        videoInputs.forEach((device, index) => {
          const option = document.createElement('option');
          option.value = device.deviceId;
          const label = device.label || `Camera ${index + 1}`;
          option.textContent = label;

          const l = label.toLowerCase();
          if ((l.includes('back') || l.includes('rear') || l.includes('environment')) &&
              !l.includes('wide') && !l.includes('ultra') && !l.includes('macro')) {
            selectedId = device.deviceId;
          }
          cameraSelect.appendChild(option);
        });

        cameraSelect.value = selectedId;
        await startCamera(selectedId);
      } catch (err) {
        alert('Camera permissions required.');
      }
    }

    async function startCamera(deviceId) {
      if (stream) stream.getTracks().forEach(t => t.stop());

      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: {
            deviceId: deviceId ? { exact: deviceId } : undefined,
            width: { ideal: 3840 },
            height: { ideal: 2160 }
          },
          audio: false
        });
        video.srcObject = stream;
      } catch (err) {
        console.error(err);
      }
    }

    cameraSelect.onchange = () => startCamera(cameraSelect.value);

    document.getElementById('btn-capture').onclick = () => {
      if (!video.videoWidth || !ocrEngine) return;

      const rawCanvas = document.createElement('canvas');
      rawCanvas.width = video.videoWidth;
      rawCanvas.height = video.videoHeight;
      const ctx = rawCanvas.getContext('2d');
      ctx.drawImage(video, 0, 0);

      capturedImage.src = rawCanvas.toDataURL('image/jpeg', 0.95);

      cameraView.classList.add('hidden');
      selectView.classList.remove('hidden');
      ocrLoader.classList.remove('hidden');
      overlayContainer.innerHTML = '';

      capturedImage.onload = () => runPaddleInference(rawCanvas);
    };

    async function runPaddleInference(canvas) {
      try {
        loaderStatus.textContent = 'Detecting Text Bboxes...';
        
        // Native local browser inference via installed Paddle engine
        const results = await ocrEngine.predict(canvas);
        const items = results[0]?.items || [];

        renderPaddleBoxes(items, canvas.width, canvas.height);
      } catch (err) {
        alert('PaddleOCR inference error.');
        console.error(err);
      } finally {
        ocrLoader.classList.add('hidden');
      }
    }

    function renderPaddleBoxes(items, imgWidth, imgHeight) {
      overlayContainer.innerHTML = '';
      const rect = capturedImage.getBoundingClientRect();
      const scaleX = rect.width / imgWidth;
      const scaleY = rect.height / imgHeight;

      items.forEach(item => {
        const text = item.text || item.description || '';
        if (!text.trim()) return;

        // Bounding box mapping from polygon/points
        const points = item.box || item.points || [];
        let xMin, yMin, xMax, yMax;

        if (points.length >= 4) {
          xMin = Math.min(...points.map(p => p[0]));
          yMin = Math.min(...points.map(p => p[1]));
          xMax = Math.max(...points.map(p => p[0]));
          yMax = Math.max(...points.map(p => p[1]));
        } else {
          xMin = item.bounds?.x || 0;
          yMin = item.bounds?.y || 0;
          xMax = xMin + (item.bounds?.width || 0);
          yMax = yMin + (item.bounds?.height || 0);
        }

        const box = document.createElement('div');
        box.className = 'box-target';
        box.style.left = `${xMin * scaleX}px`;
        box.style.top = `${yMin * scaleY}px`;
        box.style.width = `${(xMax - xMin) * scaleX}px`;
        box.style.height = `${(yMax - yMin) * scaleY}px`;

        box.onclick = () => selectText(text);
        overlayContainer.appendChild(box);
      });
    }

    function selectText(text) {
      selectView.classList.add('hidden');
      qrView.classList.remove('hidden');
      resultText.textContent = text;
      renderQRCode(text);
    }

    function renderQRCode(text) {
      qrcodeEl.innerHTML = '';
      new QRCode(qrcodeEl, {
        text: text || ' ',
        width: 220,
        height: 220,
        colorDark: "#000000",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.H
      });
    }

    resultText.oninput = () => renderQRCode(resultText.textContent);

    document.getElementById('btn-retake').onclick = resetToCamera;
    document.getElementById('btn-new-photo').onclick = resetToCamera;
    document.getElementById('btn-pick-another').onclick = () => {
      qrView.classList.add('hidden');
      selectView.classList.remove('hidden');
    };

    function resetToCamera() {
      selectView.classList.add('hidden');
      qrView.classList.add('hidden');
      cameraView.classList.remove('hidden');
      overlayContainer.innerHTML = '';
    }
  </script>
</body>
</html>

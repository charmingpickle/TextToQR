<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Offline BIOS Reader</title>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    :root {
      --bg: #09090b;
      --surface: #18181b;
      --accent: #2563eb;
      --border: #3f3f46;
      --text: #f4f4f5;
      --muted: #a1a1aa;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); min-height: 100dvh; display: flex; flex-direction: column; }

    /* INSTALL BANNER */
    .install-banner {
      background: #1e3a8a;
      border-bottom: 1px solid var(--accent);
      padding: 12px 16px;
      font-size: 0.85rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .install-banner span { color: #dbeafe; }
    .close-banner { background: none; border: none; color: white; font-size: 1.2rem; cursor: pointer; }

    /* VIEWPORT & SCANNER */
    .viewport { position: relative; flex: 1; background: #000; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    video { width: 100%; height: 100%; object-fit: contain; }
    
    .target-box {
      position: absolute; width: 85%; height: 70px;
      border: 2px solid var(--accent); border-radius: 8px;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.65);
      pointer-events: none; display: flex; align-items: center; justify-content: center;
    }
    .target-box::after {
      content: "ALIGN LINE HERE"; color: #fff; font-size: 0.7rem; font-weight: 700;
      letter-spacing: 1px; background: var(--accent); padding: 2px 8px; border-radius: 4px;
      position: absolute; top: -20px;
    }

    /* DOWNLOAD OVERLAY & PROGRESS BAR */
    .setup-overlay {
      position: absolute; inset: 0; background: rgba(9, 9, 11, 0.95);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 30px; z-index: 10; gap: 16px; text-align: center;
    }
    .progress-container { width: 100%; max-width: 300px; background: var(--border); height: 12px; border-radius: 6px; overflow: hidden; }
    .progress-bar { width: 0%; height: 100%; background: var(--accent); transition: width 0.2s ease; }

    /* INTERFACE CONTROLS */
    .controls { padding: 20px; background: var(--surface); border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 12px; align-items: center; }
    button.btn-capture {
      width: 100%; max-width: 320px; background: var(--accent); color: white; border: none;
      padding: 14px; border-radius: 10px; font-weight: 600; font-size: 1rem; cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    #result-container { display: none; width: 100%; max-width: 320px; margin-top: 10px; flex-direction: column; align-items: center; gap: 10px; }
    #result-text { font-family: monospace; font-size: 1.1rem; color: #fff; background: var(--bg); padding: 8px 12px; border-radius: 6px; border: 1px solid var(--border); width: 100%; word-break: break-all; }
    #qrcode { background: #fff; padding: 12px; border-radius: 12px; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- STEP 1: INSTALLATION INSTRUCTIONS BANNER -->
  <div id="install-banner" class="install-banner">
    <span>💡 <strong>Save as App:</strong> Tap <strong>Share/Menu</strong> & select <strong>"Add to Home Screen"</strong> to run offline.</span>
    <button class="close-banner" onclick="document.getElementById('install-banner').classList.add('hidden')">✕</button>
  </div>

  <div class="viewport">
    <video id="video" autoplay playsinline muted></video>
    <div class="target-box"></div>

    <!-- STEP 2: ONBOARDING MODEL DOWNLOAD OVERLAY -->
    <div id="setup-overlay" class="setup-overlay">
      <h3>First-Time Setup</h3>
      <p style="font-size: 0.85rem; color: var(--muted);">Downloading offline AI model to browser storage...</p>
      
      <div class="progress-container">
        <div id="progress-bar" class="progress-bar"></div>
      </div>
      <div id="progress-text" style="font-size: 0.8rem; font-weight: bold;">0%</div>
    </div>
  </div>

  <!-- STEP 3: READY APP CONTROLS -->
  <div class="controls">
    <button id="btn-capture" class="btn-capture" disabled>Initialising Setup...</button>
    
    <div id="result-container">
      <div id="result-text" contenteditable="true"></div>
      <div id="qrcode"></div>
    </div>
  </div>

  <script type="module">
    import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.0.0';

    // Enable automatic Web Cache / IndexedDB persistence
    env.allowLocalModels = false;
    env.useBrowserCache = true;

    const video = document.getElementById('video');
    const setupOverlay = document.getElementById('setup-overlay');
    const progressBar = document.getElementById('progress-bar');
    const progressText = document.getElementById('progress-text');
    const btnCapture = document.getElementById('btn-capture');
    const resultContainer = document.getElementById('result-container');
    const resultText = document.getElementById('result-text');
    const qrcodeEl = document.getElementById('qrcode');

    let ocrPipeline = null;

    // Start native camera feed
    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 1920 } } })
      .then(stream => { video.srcObject = stream; })
      .catch(err => alert("Camera permission required."));

    // Download AI weights with progress tracking
    async function initModel() {
      try {
        ocrPipeline = await pipeline('image-to-text', 'Xenova/trocr-small-printed', {
          device: 'webgpu',
          progress_callback: (data) => {
            if (data.status === 'progress') {
              const p = Math.round(data.progress || 0);
              progressBar.style.width = `${p}%`;
              progressText.textContent = `${p}%`;
            }
          }
        });

        // Hide download overlay once model binary is stored locally
        setupOverlay.classList.add('hidden');
        btnCapture.textContent = "Scan Selected Area";
        btnCapture.disabled = false;
      } catch (err) {
        console.warn("WebGPU unavailable, falling back to WebAssembly:", err);
        // Fallback execution engine
        ocrPipeline = await pipeline('image-to-text', 'Xenova/trocr-small-printed', {
          progress_callback: (data) => {
            if (data.status === 'progress') {
              const p = Math.round(data.progress || 0);
              progressBar.style.width = `${p}%`;
              progressText.textContent = `${p}%`;
            }
          }
        });
        setupOverlay.classList.add('hidden');
        btnCapture.textContent = "Scan Selected Area";
        btnCapture.disabled = false;
      }
    }

    initModel();

    // Perform Local Execution
    btnCapture.onclick = async () => {
      if (!ocrPipeline) return;

      btnCapture.textContent = "Analyzing...";
      btnCapture.disabled = true;

      // Create cropped slice corresponding to the alignment reticle
      const canvas = document.createElement('canvas');
      canvas.width = 400;
      canvas.height = 90;
      const ctx = canvas.getContext('2d');

      const vW = video.videoWidth;
      const vH = video.videoHeight;
      
      // Crop central area matching reticle box
      ctx.drawImage(video, vW * 0.075, vH * 0.42, vW * 0.85, vH * 0.16, 0, 0, 400, 90);

      const dataUrl = canvas.toDataURL('image/png');
      
      try {
        const output = await ocrPipeline(dataUrl);
        const parsed = (output[0]?.generated_text || '').replace(/[^A-Za-z0-9:-]/g, '').trim();

        resultContainer.style.display = 'flex';
        resultText.textContent = parsed || "RETRY_ALIGNMENT";
        
        // Generate QR code
        qrcodeEl.innerHTML = '';
        new QRCode(qrcodeEl, { text: parsed || "RETRY", width: 160, height: 160 });
      } catch (e) {
        alert("Scan failed. Ensure text is clearly framed inside target.");
      } finally {
        btnCapture.textContent = "Scan Selected Area";
        btnCapture.disabled = false;
      }
    };

    resultText.oninput = () => {
      qrcodeEl.innerHTML = '';
      new QRCode(qrcodeEl, { text: resultText.textContent || ' ', width: 160, height: 160 });
    };
  </script>
</body>
</html>

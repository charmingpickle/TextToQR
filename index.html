<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#09090b" />
  <title>99% Precision BIOS Reader</title>

  <!-- High-Accuracy OCR & QR Engine -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    :root {
      --bg-main: #09090b;
      --bg-surface: #18181b;
      --bg-card: #27272a;
      --accent-color: #2563eb;
      --accent-hover: #1d4ed8;
      --text-main: #f4f4f5;
      --text-muted: #a1a1aa;
      --border-color: #3f3f46;
      --target-color: #3b82f6;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-main);
      color: var(--text-main);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .view {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      width: 100%; height: 100dvh;
      overflow: hidden;
    }

    .viewport {
      flex: 1;
      position: relative;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    video, #captured-image {
      width: 100%; height: 100%;
      object-fit: contain;
    }

    /* Target Reticle for 99% Accuracy Focus */
    .target-reticle {
      position: absolute;
      width: 85%;
      height: 70px;
      border: 2px solid var(--target-color);
      border-radius: 8px;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.65), 0 0 15px rgba(59, 130, 246, 0.5);
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 5;
    }

    .target-reticle::after {
      content: "ALIGN SERIAL OR MAC HERE";
      color: #ffffff;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 1px;
      background: rgba(37, 99, 235, 0.85);
      padding: 4px 10px;
      border-radius: 4px;
      position: absolute;
      top: -24px;
    }

    .control-bar {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 24px 32px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
      z-index: 10;
    }

    .shutter-btn {
      width: 80px; height: 80px;
      border-radius: 50%;
      border: 4px solid #fff;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      outline: none;
    }

    .shutter-btn:active { transform: scale(0.92); }

    .shutter-btn-inner {
      width: 62px; height: 62px;
      border-radius: 50%;
      background: #fff;
    }

    .icon-btn {
      width: 48px; height: 48px;
      border-radius: 50%;
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.2);
      color: white;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .loader-overlay {
      position: absolute;
      inset: 0;
      background: rgba(9, 9, 11, 0.9);
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      gap: 16px;
    }

    .spinner {
      width: 44px; height: 44px;
      border: 4px solid var(--border-color);
      border-top-color: var(--accent-color);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .view-header {
      padding: 18px 20px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-color);
      text-align: center;
      font-weight: 600;
      font-size: 1.05rem;
    }

    .action-bar {
      padding: 16px 20px 28px;
      background: var(--bg-surface);
      border-top: 1px solid var(--border-color);
      display: flex;
      gap: 12px;
    }

    button.btn {
      flex: 1;
      background: var(--accent-color);
      color: white;
      border: none;
      padding: 14px 20px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }

    button.btn-secondary {
      background: var(--bg-card);
      color: var(--text-main);
      border: 1px solid var(--border-color);
    }

    #qr-container-view {
      flex: 1;
      overflow-y: auto;
      padding: 32px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
    }

    .qr-card {
      background: #ffffff;
      padding: 20px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .text-editor-card {
      width: 100%; max-width: 360px;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .text-editor-card label {
      font-size: 0.75rem;
      text-transform: uppercase;
      color: var(--text-muted);
      font-weight: 700;
    }

    #result-text {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 1.25rem;
      color: var(--text-main);
      outline: none;
      word-break: break-all;
      min-height: 1.5em;
      user-select: text;
      letter-spacing: 1px;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- CAMERA VIEW -->
  <div id="camera-view" class="view">
    <div class="viewport" id="cam-viewport">
      <video id="video" autoplay playsinline muted></video>
      <div class="target-reticle" id="reticle"></div>
    </div>
    <div class="control-bar">
      <button class="icon-btn" id="btn-switch" aria-label="Switch Camera">⟳</button>
      <button class="shutter-btn" id="btn-capture" aria-label="Take Photo">
        <div class="shutter-btn-inner"></div>
      </button>
      <div style="width: 48px;"></div>
    </div>
  </div>

  <!-- PROCESSING / LOADER VIEW -->
  <div id="processing-view" class="view hidden">
    <div class="loader-overlay">
      <div class="spinner"></div>
      <div style="font-weight: 600; font-size: 1.1rem;">Binarizing & Extracting...</div>
      <div style="font-size: 0.85rem; color: var(--text-muted);">Removing LCD screen Moiré noise</div>
    </div>
  </div>

  <!-- QR OUTPUT VIEW -->
  <div id="qr-view" class="view hidden">
    <div class="view-header">Generated QR Code</div>
    <div id="qr-container-view">
      <div class="qr-card">
        <div id="qrcode"></div>
      </div>
      <div class="text-editor-card">
        <label>Extracted Result (Tap to edit if needed)</label>
        <div id="result-text" contenteditable="true" spellcheck="false"></div>
      </div>
    </div>
    <div class="action-bar">
      <button id="btn-new-photo" class="btn">Scan Another Line</button>
    </div>
  </div>

  <script>
    const video = document.getElementById('video');
    const cameraView = document.getElementById('camera-view');
    const processingView = document.getElementById('processing-view');
    const qrView = document.getElementById('qr-view');
    const reticle = document.getElementById('reticle');
    const resultText = document.getElementById('result-text');
    const qrcodeEl = document.getElementById('qrcode');

    let stream = null;
    let devices = [];
    let currentDeviceIdx = 0;
    let tesseractWorker = null;

    async function initApp() {
      try {
        devices = (await navigator.mediaDevices.enumerateDevices())
          .filter(d => d.kind === 'videoinput');
        await startCamera({ facingMode: { ideal: 'environment' } });
        
        // Pre-initialize Tesseract with strict BIOS parameters
        tesseractWorker = await Tesseract.createWorker('eng');
        await tesseractWorker.setParameters({
          tessedit_char_whitelist: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789-:',
          tessedit_pageseg_mode: Tesseract.PSM.SINGLE_LINE
        });
      } catch (e) {
        alert('Camera access is required.');
      }
    }

    async function startCamera(constraints) {
      if (stream) stream.getTracks().forEach(t => t.stop());
      stream = await navigator.mediaDevices.getUserMedia({
        video: { width: { ideal: 3840 }, height: { ideal: 2160 }, ...constraints },
        audio: false
      });
      video.srcObject = stream;
    }

    document.getElementById('btn-switch').onclick = () => {
      if (devices.length < 2) return;
      currentDeviceIdx = (currentDeviceIdx + 1) % devices.length;
      startCamera({ deviceId: { exact: devices[currentDeviceIdx].deviceId } });
    };

    // CAPTURE & OPTICAL ISOLATION PIPELINE
    document.getElementById('btn-capture').onclick = async () => {
      if (!video.videoWidth) return;

      cameraView.classList.add('hidden');
      processingView.classList.remove('hidden');

      // 1. Isolate Reticle ROI (Region of Interest)
      const vRect = video.getBoundingClientRect();
      const rRect = reticle.getBoundingClientRect();

      const scaleX = video.videoWidth / vRect.width;
      const scaleY = video.videoHeight / vRect.height;

      const cropX = (rRect.left - vRect.left) * scaleX;
      const cropY = (rRect.top - vRect.top) * scaleY;
      const cropW = rRect.width * scaleX;
      const cropH = rRect.height * scaleY;

      // 2. High-Resolution Upscaled Crop Canvas
      const scaleFactor = 3; // Upsample small BIOS text for 99% accuracy
      const cropCanvas = document.createElement('canvas');
      cropCanvas.width = cropW * scaleFactor;
      cropCanvas.height = cropH * scaleFactor;

      const ctx = cropCanvas.getContext('2d');
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(video, cropX, cropY, cropW, cropH, 0, 0, cropCanvas.width, cropCanvas.height);

      // 3. Screen Noise Threshold Filtering (Strict Binarization)
      const imgData = ctx.getImageData(0, 0, cropCanvas.width, cropCanvas.height);
      const data = imgData.data;
      
      for (let i = 0; i < data.length; i += 4) {
        const luma = data[i] * 0.299 + data[i + 1] * 0.587 + data[i + 2] * 0.114;
        // Turn screen grey background white, make BIOS text deep black
        const v = luma > 130 ? 255 : 0;
        data[i] = v; data[i + 1] = v; data[i + 2] = v;
      }
      ctx.putImageData(imgData, 0, 0);

      // 4. Run OCR Engine on Cleaned ROI Slice
      try {
        const { data: ocr } = await tesseractWorker.recognize(cropCanvas);
        
        let cleaned = (ocr.text || '')
          .replace(/[^A-Za-z0-9:-]/g, '') // Strip OCR noise
          .trim();

        if (!cleaned) cleaned = "RETRY_ALIGNMENT";

        processingView.classList.add('hidden');
        qrView.classList.remove('hidden');

        resultText.textContent = cleaned;
        renderQRCode(cleaned);
      } catch (err) {
        alert("Read failed. Hold steady and align target box.");
        resetToCamera();
      }
    };

    function renderQRCode(text) {
      qrcodeEl.innerHTML = '';
      new QRCode(qrcodeEl, {
        text: text || ' ',
        width: 220,
        height: 220,
        colorDark: "#000000",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.H
      });
    }

    resultText.oninput = () => renderQRCode(resultText.textContent);
    document.getElementById('btn-new-photo').onclick = resetToCamera;

    function resetToCamera() {
      qrView.classList.add('hidden');
      processingView.classList.add('hidden');
      cameraView.classList.remove('hidden');
    }

    window.onload = initApp;
  </script>
</body>
</html>

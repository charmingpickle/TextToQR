<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#09090b" />
  <title>BIOS Tap → QR</title>

  <!-- External Dependencies -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    :root {
      --bg-main: #09090b;
      --bg-surface: #18181b;
      --bg-card: #27272a;
      --accent-color: #3b82f6;
      --accent-hover: #2563eb;
      --text-main: #f4f4f5;
      --text-muted: #a1a1aa;
      --border-color: #3f3f46;
      --box-highlight: rgba(59, 130, 246, 0.35);
      --box-border: #60a5fa;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg-main);
      color: var(--text-main);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .view {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
    }

    .viewport {
      flex: 1;
      position: relative;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    video, #captured-image {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .view-finder {
      position: absolute;
      width: 85%;
      height: 55%;
      border: 2px dashed rgba(255, 255, 255, 0.4);
      border-radius: 16px;
      pointer-events: none;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding-top: 12px;
    }

    .view-finder::after {
      content: "Position BIOS text inside frame";
      color: rgba(255, 255, 255, 0.7);
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      background: rgba(0, 0, 0, 0.65);
      padding: 6px 14px;
      border-radius: 20px;
      backdrop-filter: blur(4px);
    }

    #overlay-container {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: auto;
    }

    .box-target {
      position: absolute;
      border: 1.5px solid var(--box-border);
      background: var(--box-highlight);
      border-radius: 4px;
      cursor: pointer;
      box-shadow: 0 0 8px rgba(59, 130, 246, 0.4);
      transition: transform 0.08s ease, background-color 0.12s ease;
    }

    .box-target:active {
      transform: scale(0.98);
      background: rgba(59, 130, 246, 0.75);
      border-color: #ffffff;
    }

    .loader-overlay {
      position: absolute;
      inset: 0;
      background: rgba(9, 9, 11, 0.85);
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      gap: 16px;
    }

    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid var(--border-color);
      border-top-color: var(--accent-color);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .control-bar {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 24px 32px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
      z-index: 10;
    }

    .shutter-btn {
      width: 80px; height: 80px;
      border-radius: 50%;
      border: 4px solid #fff;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      outline: none;
      transition: transform 0.1s ease;
    }

    .shutter-btn:active { transform: scale(0.92); }

    .shutter-btn-inner {
      width: 62px; height: 62px;
      border-radius: 50%;
      background: #fff;
    }

    .icon-btn {
      width: 48px; height: 48px;
      border-radius: 50%;
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.2);
      color: white;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .view-header {
      padding: 18px 20px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-color);
      text-align: center;
      font-weight: 600;
      font-size: 1.05rem;
    }

    .action-bar {
      padding: 16px 20px 28px;
      background: var(--bg-surface);
      border-top: 1px solid var(--border-color);
      display: flex;
      gap: 12px;
    }

    button.btn {
      flex: 1;
      background: var(--accent-color);
      color: white;
      border: none;
      padding: 14px 20px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    button.btn:active { background: var(--accent-hover); }

    button.btn-secondary {
      background: var(--bg-card);
      color: var(--text-main);
      border: 1px solid var(--border-color);
    }

    #qr-container-view {
      flex: 1;
      overflow-y: auto;
      padding: 32px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
    }

    .qr-card {
      background: #ffffff;
      padding: 20px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .text-editor-card {
      width: 100%;
      max-width: 360px;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .text-editor-card label {
      font-size: 0.75rem;
      text-transform: uppercase;
      color: var(--text-muted);
      font-weight: 700;
    }

    #result-text {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 1.15rem;
      color: var(--text-main);
      outline: none;
      word-break: break-all;
      min-height: 1.5em;
      user-select: text;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- CAMERA VIEW -->
  <div id="camera-view" class="view">
    <div class="viewport">
      <video id="video" autoplay playsinline muted></video>
      <div class="view-finder"></div>
    </div>
    <div class="control-bar">
      <button class="icon-btn" id="btn-switch" aria-label="Switch Camera">⟳</button>
      <button class="shutter-btn" id="btn-capture" aria-label="Take Photo">
        <div class="shutter-btn-inner"></div>
      </button>
      <div style="width: 48px;"></div>
    </div>
  </div>

  <!-- SELECT VIEW -->
  <div id="select-view" class="view hidden">
    <div class="view-header" id="select-status">Tap target text to generate QR</div>
    <div class="viewport" id="select-viewport">
      <img id="captured-image" alt="Captured document" />
      <div id="overlay-container"></div>
      <div id="ocr-loader" class="loader-overlay">
        <div class="spinner"></div>
        <div style="font-weight: 500;">Detecting Serial Numbers & MACs…</div>
      </div>
    </div>
    <div class="action-bar">
      <button id="btn-retake" class="btn btn-secondary">Retake Photo</button>
    </div>
  </div>

  <!-- QR OUTPUT VIEW -->
  <div id="qr-view" class="view hidden">
    <div class="view-header">Generated QR Code</div>
    <div id="qr-container-view">
      <div class="qr-card">
        <div id="qrcode"></div>
      </div>
      <div class="text-editor-card">
        <label>Extracted Text (Tap to edit)</label>
        <div id="result-text" contenteditable="true" spellcheck="false"></div>
      </div>
    </div>
    <div class="action-bar">
      <button id="btn-pick-another" class="btn btn-secondary">Select Another Line</button>
      <button id="btn-new-photo" class="btn">New Photo</button>
    </div>
  </div>

  <script>
    const video = document.getElementById('video');
    const cameraView = document.getElementById('camera-view');
    const selectView = document.getElementById('select-view');
    const qrView = document.getElementById('qr-view');
    const capturedImage = document.getElementById('captured-image');
    const overlayContainer = document.getElementById('overlay-container');
    const ocrLoader = document.getElementById('ocr-loader');
    const resultText = document.getElementById('result-text');
    const qrcodeEl = document.getElementById('qrcode');
    const selectStatus = document.getElementById('select-status');

    let stream = null;
    let devices = [];
    let currentDeviceIdx = 0;
    let tesseractWorker = null;

    async function initApp() {
      try {
        devices = (await navigator.mediaDevices.enumerateDevices())
          .filter(d => d.kind === 'videoinput');
        
        await startCamera({ facingMode: { ideal: 'environment' } });
      } catch (e) {
        alert('Camera access is required.');
      }
    }

    async function startCamera(constraints) {
      if (stream) stream.getTracks().forEach(t => t.stop());
      
      stream = await navigator.mediaDevices.getUserMedia({
        video: { width: { ideal: 3840 }, height: { ideal: 2160 }, ...constraints },
        audio: false
      });
      video.srcObject = stream;
    }

    document.getElementById('btn-switch').onclick = () => {
      if (devices.length < 2) return;
      currentDeviceIdx = (currentDeviceIdx + 1) % devices.length;
      startCamera({ deviceId: { exact: devices[currentDeviceIdx].deviceId } });
    };

    // Fast screen-optimized normalization replaces Sauvola thresholding
    function preprocessCanvas(sourceCanvas) {
      const maxDim = 1920;
      let w = sourceCanvas.width;
      let h = sourceCanvas.height;

      if (w > maxDim || h > maxDim) {
        if (w > h) { h = Math.round((h * maxDim) / w); w = maxDim; }
        else { w = Math.round((w * maxDim) / h); h = maxDim; }
      }

      const canvas = document.createElement('canvas');
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(sourceCanvas, 0, 0, w, h);

      const imgData = ctx.getImageData(0, 0, w, h);
      const data = imgData.data;

      // High-contrast grayscale mapping (preserves pixel fonts while stripping screen glow)
      for (let i = 0; i < data.length; i += 4) {
        let v = data[i] * 0.299 + data[i + 1] * 0.587 + data[i + 2] * 0.114;
        v = (v - 50) * 1.4; // Contrast stretch
        v = v < 0 ? 0 : (v > 255 ? 255 : v);
        data[i] = v; data[i + 1] = v; data[i + 2] = v;
      }
      ctx.putImageData(imgData, 0, 0);
      return canvas;
    }

    document.getElementById('btn-capture').onclick = () => {
      if (!video.videoWidth) return;

      const rawCanvas = document.createElement('canvas');
      rawCanvas.width = video.videoWidth;
      rawCanvas.height = video.videoHeight;
      rawCanvas.getContext('2d').drawImage(video, 0, 0);

      capturedImage.src = rawCanvas.toDataURL('image/jpeg', 0.95);

      cameraView.classList.add('hidden');
      selectView.classList.remove('hidden');
      ocrLoader.classList.remove('hidden');
      overlayContainer.innerHTML = '';
      selectStatus.textContent = "Analyzing BIOS Screen...";

      capturedImage.onload = () => runOCR(rawCanvas);
    };

    async function runOCR(rawCanvas) {
      try {
        const processedCanvas = preprocessCanvas(rawCanvas);

        if (!tesseractWorker) {
          tesseractWorker = await Tesseract.createWorker('eng');
        }

        await tesseractWorker.setParameters({
          tessedit_char_whitelist: 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-:.()/ ',
          tessedit_pageseg_mode: Tesseract.PSM.SINGLE_BLOCK
        });

        const { data } = await tesseractWorker.recognize(processedCanvas);
        selectStatus.textContent = "Tap desired text line to convert";
        renderLineBoxes(data.lines || [], processedCanvas.width, processedCanvas.height);
      } catch (err) {
        alert('OCR engine failed. Please try again.');
        console.error(err);
      } finally {
        ocrLoader.classList.add('hidden');
      }
    }

    // Maps full line structures instead of broken word fragments
    function renderLineBoxes(lines, imgWidth, imgHeight) {
      overlayContainer.innerHTML = '';
      
      const rect = capturedImage.getBoundingClientRect();
      const scaleX = rect.width / imgWidth;
      const scaleY = rect.height / imgHeight;

      lines.forEach(line => {
        const rawText = line.text.trim();
        if (rawText.length < 3) return;

        const box = document.createElement('div');
        box.className = 'box-target';
        box.style.left = `${line.bbox.x0 * scaleX}px`;
        box.style.top = `${(line.bbox.y0 - 2) * scaleY}px`;
        box.style.width = `${(line.bbox.x1 - line.bbox.x0) * scaleX}px`;
        box.style.height = `${(line.bbox.y1 - line.bbox.y0 + 4) * scaleY}px`;

        box.onclick = () => selectText(rawText);
        overlayContainer.appendChild(box);
      });
    }

    // Strips common BIOS key labels automatically (e.g., "Serial Number: 5CD..." -> "5CD...")
    function selectText(rawText) {
      let cleaned = rawText
        .replace(/^(serial\s*no|serial\s*number|sn|mac\s*address|mac|lan\s*mac)[:\.\s\-=]+/i, '')
        .trim();

      selectView.classList.add('hidden');
      qrView.classList.remove('hidden');
      resultText.textContent = cleaned;
      renderQRCode(cleaned);
    }

    function renderQRCode(text) {
      qrcodeEl.innerHTML = '';
      new QRCode(qrcodeEl, {
        text: text || ' ',
        width: 220,
        height: 220,
        colorDark: "#000000",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.H
      });
    }

    resultText.oninput = () => renderQRCode(resultText.textContent);

    document.getElementById('btn-retake').onclick = resetToCamera;
    document.getElementById('btn-new-photo').onclick = resetToCamera;
    
    document.getElementById('btn-pick-another').onclick = () => {
      qrView.classList.add('hidden');
      selectView.classList.remove('hidden');
    };

    function resetToCamera() {
      selectView.classList.add('hidden');
      qrView.classList.add('hidden');
      cameraView.classList.remove('hidden');
      overlayContainer.innerHTML = '';
    }

    window.onload = initApp;
  </script>
</body>
</html>

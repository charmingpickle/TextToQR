<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BIOS Scanner</title>
    
    <!-- PaddleOCR and QR Code libraries -->
    <script src="https://cdn.jsdelivr.net/npm/paddleocr.js@1.0.0/dist/paddleocr.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: #f0f0f0;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        
        #app {
            height: 100%;
            width: 100%;
            display: flex;
            flex-direction: column;
            background: white;
        }
        
        #header {
            background: white;
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid #e0e0e0;
            flex-shrink: 0;
        }
        
        #header h1 {
            font-size: 20px;
            color: #333;
            font-weight: 600;
        }
        
        #cameraFrameContainer {
            flex: 1;
            padding: 15px;
            background: #f8f8f8;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 0;
            position: relative;
        }
        
        #cameraFrame {
            position: relative;
            width: 100%;
            height: 100%;
            max-height: 100%;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            border: 3px solid #ddd;
        }
        
        #cameraFeed {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        
        .corner-marker {
            position: absolute;
            width: 30px;
            height: 30px;
            border: 3px solid #00ff00;
            z-index: 10;
            pointer-events: none;
            opacity: 0.8;
        }
        
        #corner-tl { top: 10px; left: 10px; border-right: none; border-bottom: none; border-top-left-radius: 10px; }
        #corner-tr { top: 10px; right: 10px; border-left: none; border-bottom: none; border-top-right-radius: 10px; }
        #corner-bl { bottom: 10px; left: 10px; border-right: none; border-top: none; border-bottom-left-radius: 10px; }
        #corner-br { bottom: 10px; right: 10px; border-left: none; border-top: none; border-bottom-right-radius: 10px; }
        
        #cameraStatus {
            position: absolute;
            bottom: 15px;
            left: 15px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 11px;
            z-index: 10;
            pointer-events: none;
        }
        
        #controlsBar {
            background: white;
            padding: 15px;
            border-top: 1px solid #e0e0e0;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        #zoomControls {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0 10px;
        }
        
        #zoomOut, #zoomIn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid #007bff;
            background: white;
            color: #007bff;
            font-size: 20px;
            cursor: pointer;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        #zoomSlider { flex: 1; accent-color: #007bff; height: 4px; }
        
        #zoomLevel {
            min-width: 40px;
            text-align: center;
            font-size: 14px;
            font-weight: bold;
            color: #333;
        }
        
        #buttonRow {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }
        
        .icon-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 2px solid #ddd;
            background: white;
            cursor: pointer;
            font-size: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        
        #shutterBtn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: white;
            border: 4px solid #007bff;
            cursor: pointer;
            position: relative;
            flex-shrink: 0;
            transition: all 0.2s;
        }
        
        #shutterBtn:active { background: #007bff; transform: scale(0.95); }
        
        #shutterBtn::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 54px;
            height: 54px;
            border-radius: 50%;
            background: white;
            border: 3px solid #007bff;
        }
        
        #processing {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.95);
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 20px;
            z-index: 100;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #e0e0e0;
            border-top: 4px solid #007bff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        #processingText { color: #333; font-size: 16px; font-weight: 500; }
        
        #selectionScreen {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: white;
            display: none;
            flex-direction: column;
            z-index: 50;
        }
        
        #selectionHeader {
            flex-shrink: 0;
            padding: 15px;
            background: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #e0e0e0;
        }
        
        #selectionHeader button {
            padding: 10px 15px;
            border: none;
            border-radius: 8px;
            background: #007bff;
            color: white;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }
        
        #imageWrapper {
            flex: 1;
            position: relative;
            overflow: auto;
            min-height: 0;
            background: #f8f8f8;
            padding: 15px;
        }
        
        #imageContainer {
            position: relative;
            display: inline-block;
            width: 100%;
        }
        
        #processedImage {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 8px;
        }
        
        #textOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        
        .text-box {
            position: absolute;
            border: 2px solid #00ff00;
            background: rgba(0, 255, 0, 0.2);
            cursor: pointer;
            transition: all 0.2s;
            min-height: 20px;
            border-radius: 3px;
            pointer-events: auto;
        }
        
        .text-box:active {
            background: rgba(0, 255, 0, 0.4);
        }
        
        #qrScreen {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: white;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 60;
            padding: 20px;
        }
        
        #qrScreen h2 {
            margin-bottom: 20px;
            color: #333;
        }
        
        #qrScreen .value-display {
            font-family: 'Courier New', monospace;
            font-size: 18px;
            font-weight: bold;
            padding: 15px;
            background: #f8f8f8;
            border-radius: 10px;
            margin-bottom: 20px;
            word-break: break-all;
            text-align: center;
            max-width: 90%;
        }
        
        #qrScreen canvas {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }
        
        #qrScreen .button-container {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        #qrScreen button {
            padding: 15px 30px;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            min-width: 140px;
        }
        
        #qrScreen .choose-another {
            background: #007bff;
            color: white;
        }
        
        #qrScreen .retake {
            background: #28a745;
            color: white;
        }
        
        #notification {
            position: fixed;
            bottom: 180px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            z-index: 1000;
            display: none;
            pointer-events: none;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div id="app">
        <div id="header">
            <h1>📸 BIOS Scanner</h1>
        </div>
        
        <div id="cameraFrameContainer">
            <div id="cameraFrame">
                <video id="cameraFeed" autoplay playsinline></video>
                <div class="corner-marker" id="corner-tl"></div>
                <div class="corner-marker" id="corner-tr"></div>
                <div class="corner-marker" id="corner-bl"></div>
                <div class="corner-marker" id="corner-br"></div>
                <div id="cameraStatus">Loading camera...</div>
            </div>
        </div>
        
        <div id="controlsBar">
            <div id="zoomControls">
                <button id="zoomOut">−</button>
                <input type="range" id="zoomSlider" min="1" max="10" value="1" step="0.1">
                <button id="zoomIn">+</button>
                <span id="zoomLevel">1.0x</span>
            </div>
            
            <div id="buttonRow">
                <button class="icon-btn" onclick="toggleFlash()" title="Flash">⚡</button>
                <button id="shutterBtn" onclick="takePhoto()" title="Take Photo"></button>
                <button class="icon-btn" onclick="switchCamera()" title="Switch Camera">🔄</button>
            </div>
        </div>
    </div>
    
    <div id="processing">
        <div class="spinner"></div>
        <div id="processingText">Processing...</div>
    </div>
    
    <div id="selectionScreen">
        <div id="selectionHeader">
            <button onclick="retakePhoto()">📸 Retake</button>
            <span style="color:#333; font-weight:bold;">Tap Text to Select</span>
            <span></span>
        </div>
        
        <div id="imageWrapper">
            <div id="imageContainer">
                <img id="processedImage" alt="Processed Image">
                <div id="textOverlay"></div>
            </div>
        </div>
    </div>
    
    <div id="qrScreen">
        <h2>Scan QR Code</h2>
        <div class="value-display" id="qrValueDisplay"></div>
        <canvas id="qrCanvas"></canvas>
        <div class="button-container">
            <button class="choose-another" onclick="chooseAnother()">Choose Another Text</button>
            <button class="retake" onclick="retakePhoto()">Retake Photo</button>
        </div>
    </div>
    
    <div id="notification"></div>
    
    <script>
        let video = document.getElementById('cameraFeed');
        let stream = null;
        let currentCameraIndex = -1;
        let cameras = [];
        let flashOn = false;
        let currentZoom = 1;
        let imageWidth = 0;
        let imageHeight = 0;
        let paddleOCR = null;
        
        // Initialize PaddleOCR
        async function initPaddleOCR() {
            try {
                paddleOCR = new PaddleOCR({
                    lang: 'en',
                    det: true,
                    rec: true,
                    cls: false
                });
                await paddleOCR.init();
                console.log('PaddleOCR initialized');
            } catch (error) {
                console.error('PaddleOCR init failed:', error);
            }
        }
        
        async function initCamera() {
            try {
                if (stream) {
                    stream.getTracks().forEach(track => track.stop());
                }
                
                await listCameras(false);
                await startCamera(currentCameraIndex);
            } catch (error) {
                console.error('Camera init error:', error);
                document.getElementById('cameraStatus').textContent = 'Camera error';
            }
        }
        
        async function listCameras(showSelector = true) {
            try {
                const devices = await navigator.mediaDevices.enumerateDevices();
                cameras = devices.filter(device => device.kind === 'videoinput');
                console.log('Found cameras:', cameras);
                return cameras;
            } catch (error) {
                console.error('List cameras error:', error);
                return [];
            }
        }
        
        async function startCamera(index) {
            try {
                if (stream) {
                    stream.getTracks().forEach(track => track.stop());
                }
                
                let constraints;
                if (index >= 0 && cameras[index]) {
                    constraints = {
                        video: {
                            deviceId: { exact: cameras[index].deviceId },
                            width: { ideal: 1920 },
                            height: { ideal: 1080 }
                        },
                        audio: false
                    };
                } else {
                    constraints = {
                        video: {
                            facingMode: 'environment',
                            width: { ideal: 1920 },
                            height: { ideal: 1080 }
                        },
                        audio: false
                    };
                }
                
                stream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = stream;
                
                const track = stream.getVideoTracks()[0];
                const label = track.label || 'Camera';
                document.getElementById('cameraStatus').textContent = `📷 ${label}`;
                
                const capabilities = track.getCapabilities();
                if (capabilities.zoom) {
                    document.getElementById('zoomSlider').max = capabilities.zoom.max;
                }
            } catch (error) {
                console.error('Start camera error:', error);
                try {
                    stream = await navigator.mediaDevices.getUserMedia({ 
                        video: { facingMode: 'environment' } 
                    });
                    video.srcObject = stream;
                    document.getElementById('cameraStatus').textContent = '📷 Camera';
                } catch (fallbackError) {
                    document.getElementById('cameraStatus').textContent = '❌ Camera failed';
                }
            }
        }
        
        async function switchCamera() {
            currentCameraIndex = (currentCameraIndex + 1) % Math.max(cameras.length, 1);
            await startCamera(currentCameraIndex);
        }
        
        async function toggleFlash() {
            try {
                if (stream) {
                    const track = stream.getVideoTracks()[0];
                    const capabilities = track.getCapabilities();
                    if (capabilities.torch) {
                        flashOn = !flashOn;
                        await track.applyConstraints({
                            advanced: [{ torch: flashOn }]
                        });
                        showNotification(flashOn ? 'Flash ON' : 'Flash OFF');
                    } else {
                        showNotification('No flash on this camera');
                    }
                }
            } catch (error) {
                console.error('Flash error:', error);
            }
        }
        
        document.getElementById('zoomIn').addEventListener('click', () => setZoom(currentZoom + 0.5));
        document.getElementById('zoomOut').addEventListener('click', () => setZoom(currentZoom - 0.5));
        document.getElementById('zoomSlider').addEventListener('input', (e) => setZoom(parseFloat(e.target.value)));
        
        async function setZoom(level) {
            currentZoom = Math.max(1, Math.min(level, 10));
            try {
                if (stream) {
                    const track = stream.getVideoTracks()[0];
                    const capabilities = track.getCapabilities();
                    if (capabilities.zoom) {
                        await track.applyConstraints({
                            advanced: [{ zoom: currentZoom }]
                        });
                    } else {
                        video.style.transform = `scale(${currentZoom})`;
                    }
                }
                document.getElementById('zoomLevel').textContent = `${currentZoom.toFixed(1)}x`;
                document.getElementById('zoomSlider').value = currentZoom;
            } catch (error) {
                console.error('Zoom error:', error);
            }
        }
        
        async function takePhoto() {
            try {
                document.getElementById('processing').style.display = 'flex';
                document.getElementById('processingText').textContent = 'Capturing...';
                
                const canvas = document.createElement('canvas');
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0);
                
                document.getElementById('processingText').textContent = 'Processing with PaddleOCR...';
                const results = await runPaddleOCR(canvas);
                
                showSelectionScreen(canvas, results);
                
                document.getElementById('processing').style.display = 'none';
            } catch (error) {
                console.error('Photo error:', error);
                document.getElementById('processing').style.display = 'none';
                showNotification('Failed to process image');
            }
        }
        
        async function runPaddleOCR(canvas) {
            try {
                if (!paddleOCR) {
                    await initPaddleOCR();
                }
                
                // Convert canvas to image data
                const imageData = canvas.toDataURL('image/jpeg', 0.9);
                
                // Run PaddleOCR
                const results = await paddleOCR.recognize(imageData);
                
                console.log('PaddleOCR results:', results);
                
                return results;
            } catch (error) {
                console.error('PaddleOCR error:', error);
                return null;
            }
        }
        
        function showSelectionScreen(canvas, ocrResults) {
            imageWidth = canvas.width;
            imageHeight = canvas.height;
            
            document.getElementById('app').style.display = 'none';
            document.getElementById('selectionScreen').style.display = 'flex';
            
            const img = document.getElementById('processedImage');
            img.src = canvas.toDataURL();
            
            img.onload = () => {
                document.getElementById('textOverlay').innerHTML = '';
                
                if (ocrResults && ocrResults.texts && ocrResults.texts.length > 0) {
                    createTextBoxes(ocrResults);
                } else {
                    showNotification('No text detected. Try again.');
                }
            };
        }
        
        function createTextBoxes(ocrResults) {
            const overlay = document.getElementById('textOverlay');
            
            ocrResults.texts.forEach((item, index) => {
                if (!item.text || item.text.trim().length < 1) return;
                
                const box = document.createElement('div');
                box.className = 'text-box';
                
                // PaddleOCR provides points array [x1,y1,x2,y2,x3,y3,x4,y4]
                const points = item.points || [];
                let left, top, width, height;
                
                if (points.length === 8) {
                    // Calculate bounding box from points
                    const xs = [points[0], points[2], points[4], points[6]];
                    const ys = [points[1], points[3], points[5], points[7]];
                    const minX = Math.min(...xs);
                    const maxX = Math.max(...xs);
                    const minY = Math.min(...ys);
                    const maxY = Math.max(...ys);
                    
                    left = (minX / imageWidth) * 100;
                    top = (minY / imageHeight) * 100;
                    width = ((maxX - minX) / imageWidth) * 100;
                    height = ((maxY - minY) / imageHeight) * 100;
                } else {
                    // Fallback - skip if no coordinates
                    return;
                }
                
                box.style.left = left + '%';
                box.style.top = top + '%';
                box.style.width = Math.max(width, 2) + '%';
                box.style.height = Math.max(height, 2) + '%';
                box.style.minHeight = '15px';
                
                const cleanText = item.text.trim();
                box.dataset.text = cleanText;
                box.title = cleanText;
                
                box.addEventListener('click', (e) => {
                    e.stopPropagation();
                    showQRCode(cleanText);
                });
                
                overlay.appendChild(box);
            });
        }
        
        async function showQRCode(text) {
            const cleanText = text.trim();
            if (!cleanText) return;
            
            // Show QR screen
            document.getElementById('selectionScreen').style.display = 'none';
            document.getElementById('qrScreen').style.display = 'flex';
            
            // Display the selected text
            document.getElementById('qrValueDisplay').textContent = cleanText;
            
            // Generate QR code
            const qrCanvas = document.getElementById('qrCanvas');
            await QRCode.toCanvas(qrCanvas, cleanText, {
                width: 300,
                margin: 2,
                errorCorrectionLevel: 'H'
            });
            
            // Copy to clipboard
            try {
                await navigator.clipboard.writeText(cleanText);
                showNotification('Copied to clipboard!');
            } catch (err) {
                // Clipboard might not work
            }
        }
        
        function chooseAnother() {
            document.getElementById('qrScreen').style.display = 'none';
            document.getElementById('selectionScreen').style.display = 'flex';
        }
        
        function retakePhoto() {
            document.getElementById('selectionScreen').style.display = 'none';
            document.getElementById('qrScreen').style.display = 'none';
            document.getElementById('app').style.display = 'flex';
            
            setTimeout(() => {
                initCamera();
            }, 100);
        }
        
        function showNotification(message) {
            const notification = document.getElementById('notification');
            notification.textContent = message;
            notification.style.display = 'block';
            setTimeout(() => {
                notification.style.display = 'none';
            }, 2000);
        }
        
        window.addEventListener('DOMContentLoaded', () => {
            initPaddleOCR();
            initCamera();
        });
    </script>
</body>
</html>
